[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "orca-engine"
version = "1.0.0"
description = "Streaming parser and thermochemistry engine for ORCA quantum chemistry output files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "computational-chemistry",
    "quantum-chemistry",
    "orca",
    "dft",
    "thermochemistry",
    "parser",
]
authors = [{ name = "Salam Hasan", email = "salamhasan199904@gmail.com" }]
maintainers = [{ name = "Salam Hasan", email = "salamhasan199904@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/salamhasan/orca-engine"
Repository = "https://github.com/salamhasan/orca-engine"
Issues = "https://github.com/salamhasan/orca-engine/issues"

[project.scripts]
orca-engine = "orca_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_engine"]

[tool.hatch.build.targets.sdist]
include = ["src/orca_engine", "tests", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config --basetemp=.pytest_temp"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["orca_engine"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/orca_engine", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "D202",  # a blank line after the docstring is this project's house style
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "ANN001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

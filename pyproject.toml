[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "orca-web-lab"
version = "1.0.3"
description = "Web lab, quantum chemistry analyzer, reaction editor, and thermochemistry workbench for ORCA"
readme = "README.md"
license = { text = "ORCA Web Lab Academic and Non-Commercial License v1.1" }
requires-python = ">=3.11, <3.14"
keywords = [
    "computational-chemistry",
    "quantum-chemistry",
    "orca",
    "thermochemistry",
    "spectroscopy",
    "rdkit",
    "dft",
]
authors = [
    { name = "Orca Web Lab Team" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "Flask>=3.0.3, <4.0.0",
    "gunicorn>=22.0.0; sys_platform != 'win32'",
    "requests>=2.32.3",
    "rdkit>=2023.9.0",
    "kaggle>=2.2.3",
    "google-auth>=2.32.0",
    "pillow>=10.0.0",
    "rarfile>=4.0",
    "openpyxl>=3.1.2",
    "jsonschema>=4.20.0",
    "cryptography>=41.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "a2wsgi>=1.10.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "jsonschema>=4.20.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "jsonschema>=4.20.0",
    "numpy>=1.24.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "build>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/salamhasan/orca-web-lab"
Repository = "https://github.com/salamhasan/orca-web-lab"

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "chem_core",
    "local_agent",
    "orca_orchestrator",
    "services",
    "tools",
]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "templates"
"static" = "static"
"app.py" = "app.py"
"chem_core.py" = "chem_core.py"
"kaggle_runner.py" = "kaggle_runner.py"
"reaction_conditions.py" = "reaction_conditions.py"
"orca_engine/src/orca_engine" = "orca_engine"

[tool.hatch.build.targets.sdist]
include = [
    "/api",
    "/chem_core",
    "/local_agent",
    "/orca_orchestrator",
    "/services",
    "/tools",
    "/templates",
    "/static",
    "/orca_engine",
    "app.py",
    "chem_core.py",
    "kaggle_runner.py",
    "reaction_conditions.py",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "orca_engine/tests"]
pythonpath = [".", "orca_engine/src"]
norecursedirs = ["scratch", ".git", "__pycache__", ".pytest_cache", ".pytest_temp", "test_job", "benchmarks", "data"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py311"
src = [".", "orca_engine/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

name: One-time Kaggle browser upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Patch browser login, ORCA Drive download, and cross-browser jobs
        shell: python
        run: |
          from pathlib import Path

          app = Path('static/js/app.js')
          text = app.read_text(encoding='utf-8')
          marker = '/* CHEMLAB KAGGLE BROWSER UPGRADE 2026-08-10 */'
          if marker not in text:
              upgrade = r'''

  /* CHEMLAB KAGGLE BROWSER UPGRADE 2026-08-10 */
  // Browser-side conveniences deliberately keep kaggle.json on the user's
  // device. The file is parsed locally and its contents are copied into the
  // existing sign-in fields; it is never uploaded as a file to this site.
  (function installKaggleBrowserTools() {
    const loginForm = document.getElementById('kaggle-login-form');
    const userInput = document.getElementById('kaggle-username');
    const keyInput = document.getElementById('kaggle-key');
    if (!loginForm || !userInput || !keyInput) return;

    const tools = document.createElement('div');
    tools.className = 'kaggle-browser-tools';
    tools.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;';

    const fileLabel = document.createElement('label');
    fileLabel.className = 'btn btn-ghost btn-small';
    fileLabel.textContent = '📄 Load kaggle.json';
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.json,application/json';
    fileInput.style.display = 'none';
    fileLabel.appendChild(fileInput);

    const downloadBtn = document.createElement('button');
    downloadBtn.type = 'button';
    downloadBtn.className = 'btn btn-ghost btn-small';
    downloadBtn.textContent = '⬇ Save kaggle.json';

    const settingsLink = document.createElement('a');
    settingsLink.className = 'btn btn-ghost btn-small';
    settingsLink.href = 'https://www.kaggle.com/settings/api';
    settingsLink.target = '_blank';
    settingsLink.rel = 'noopener noreferrer';
    settingsLink.textContent = 'Kaggle API settings';

    const help = document.createElement('span');
    help.className = 'field-hint';
    help.textContent = 'The JSON is read locally in your browser; it is not uploaded as a file.';

    tools.append(fileLabel, downloadBtn, settingsLink, help);
    keyInput.closest('.form-row')?.appendChild(tools);

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      try {
        const obj = JSON.parse(await file.text());
        const username = String(obj.username || '').trim();
        const key = String(obj.key || obj.token || '').trim();
        if (!username || !key) throw new Error('The selected JSON does not contain username and key/token.');
        userInput.value = username;
        keyInput.value = key;
        showToast('kaggle.json loaded locally. Press “Sign in with Kaggle” to verify it.');
      } catch (err) {
        showToast(`<strong>Could not read kaggle.json:</strong> ${err.message}`);
      } finally {
        fileInput.value = '';
      }
    });

    downloadBtn.addEventListener('click', () => {
      const username = userInput.value.trim();
      const key = keyInput.value.trim();
      if (!username || !key) {
        showToast('Enter your Kaggle username and API key/token first.');
        return;
      }
      const blob = new Blob([JSON.stringify({username, key}, null, 2) + '\n'], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'kaggle.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    // Keep the local job cache separated by Kaggle account. Without this,
    // signing into account B on a browser previously used for account A could
    // temporarily show A's locally cached jobs before the remote merge.
    function isolateLocalJobsTo(username) {
      try {
        const jobs = loadJobs().filter(j => !j.kaggleUsername || j.kaggleUsername.toLowerCase() === username.toLowerCase());
        saveJobs(jobs);
        renderJobs();
      } catch (_) {}
    }
    const signedInObserver = new MutationObserver(() => {
      if (currentKaggle && currentKaggle.username) isolateLocalJobsTo(currentKaggle.username);
    });
    if (kaggleSignedInAs) signedInObserver.observe(kaggleSignedInAs, {childList:true, characterData:true, subtree:true});

    // Explicitly re-query Kaggle, not just the browser cache. This is the
    // recovery mechanism for a new browser/device and also catches notebooks
    // submitted or auto-restarted elsewhere.
    const jobsToolbar = document.querySelector('.jobs-toolbar');
    if (jobsToolbar && !document.getElementById('jobs-account-refresh-btn')) {
      const refreshAccountBtn = document.createElement('button');
      refreshAccountBtn.type = 'button';
      refreshAccountBtn.id = 'jobs-account-refresh-btn';
      refreshAccountBtn.className = 'btn btn-ghost btn-small';
      refreshAccountBtn.textContent = '↻ Sync account jobs';
      refreshAccountBtn.addEventListener('click', async () => {
        if (!currentKaggle) {
          showToast('Sign in to Kaggle first.');
          return;
        }
        refreshAccountBtn.disabled = true;
        const old = refreshAccountBtn.textContent;
        refreshAccountBtn.textContent = 'Syncing…';
        try {
          const data = await postJSON('/api/kaggle/login', {
            kaggle_username: currentKaggle.username,
            kaggle_key: currentKaggle.key,
          });
          isolateLocalJobsTo(currentKaggle.username);
          mergeRemoteJobs(currentKaggle.username, currentKaggle.key, data.jobs || []);
          pollAllActiveJobs();
          showToast(`Kaggle account synchronized: ${(data.jobs || []).length} Chemistry Lab job(s) found.`);
        } catch (err) {
          showToast(`<strong>Account sync failed:</strong> ${err.message}`);
        } finally {
          refreshAccountBtn.disabled = false;
          refreshAccountBtn.textContent = old;
        }
      });
      jobsToolbar.insertBefore(refreshAccountBtn, jobsToolbar.firstChild);
    }

    // Live count makes it immediately obvious that jobs recovered from another
    // browser are actually active, rather than merely old entries in localStorage.
    if (jobsToolbar && !document.getElementById('jobs-running-count')) {
      const count = document.createElement('span');
      count.id = 'jobs-running-count';
      count.className = 'field-hint';
      count.style.marginLeft = 'auto';
      jobsToolbar.appendChild(count);
      const updateCount = () => {
        const active = loadJobs().filter(j => ['queued','running','restarting'].includes(j.status)).length;
        count.textContent = `Active jobs: ${active}`;
      };
      updateCount();
      setInterval(updateCount, 2000);
      document.addEventListener('visibilitychange', updateCount);
    }

    // Google Drive: expose a browser download/open action next to the source
    // field. For a normal /file/d/<ID>/ share URL we can turn it into Drive's
    // download endpoint; arbitrary direct URLs are passed through unchanged.
    const linkInput = document.getElementById('kaggle-orca-link');
    if (linkInput) {
      const wrap = linkInput.parentElement;
      const driveTools = document.createElement('div');
      driveTools.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;';
      const openDrive = document.createElement('a');
      openDrive.className = 'btn btn-ghost btn-small';
      openDrive.target = '_blank';
      openDrive.rel = 'noopener noreferrer';
      openDrive.textContent = '↗ Open link in browser';
      const downloadDrive = document.createElement('a');
      downloadDrive.className = 'btn btn-outline btn-small';
      downloadDrive.target = '_blank';
      downloadDrive.rel = 'noopener noreferrer';
      downloadDrive.textContent = '⬇ Download ORCA in browser';
      const driveStatus = document.createElement('span');
      driveStatus.className = 'field-hint';

      function normalizeDriveDownloadUrl(raw) {
        const value = (raw || '').trim();
        if (!value) return '';
        try {
          const u = new URL(value);
          if (u.hostname === 'drive.google.com' || u.hostname === 'docs.google.com') {
            let id = (u.pathname.match(/\/file\/d\/([^/]+)/) || [])[1];
            if (!id) id = u.searchParams.get('id');
            if (id) return `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}`;
          }
        } catch (_) {}
        return value;
      }
      function refreshDriveLinks() {
        const raw = linkInput.value.trim();
        const direct = normalizeDriveDownloadUrl(raw);
        openDrive.href = raw || '#';
        downloadDrive.href = direct || '#';
        openDrive.style.pointerEvents = raw ? '' : 'none';
        downloadDrive.style.pointerEvents = direct ? '' : 'none';
        driveStatus.textContent = raw ? 'Ready — the link is used by the Kaggle job and can also be opened/downloaded here.' : '';
      }
      linkInput.addEventListener('input', refreshDriveLinks);
      linkInput.addEventListener('change', refreshDriveLinks);
      driveTools.append(openDrive, downloadDrive, driveStatus);
      wrap.appendChild(driveTools);
      refreshDriveLinks();
    }
  })();
'''
              needle = '\n})();'
              if needle not in text:
                  raise SystemExit('Could not find app.js IIFE terminator')
              text = text.rsplit(needle, 1)[0] + upgrade + needle
              app.write_text(text, encoding='utf-8')

          # Make the public wording match the actual cross-browser recovery
          # mechanism: jobs are reconstructed from Kaggle, while credentials
          # are processed transiently by the server and may be optionally kept
          # in browser local storage when the user chooses Remember me.
          html = Path('templates/index.html')
          h = html.read_text(encoding='utf-8')
          h = h.replace(
              'Signing in also pulls back any jobs already submitted from this Kaggle account, so you can get\n        back to them even after clearing your browser data or switching devices.',
              'Signing in also pulls the account\'s Chemistry Lab jobs directly from Kaggle, so the list can be recovered on a new browser or device.'
          )
          h = h.replace(
              'Downloaded and extracted into /tmp on the Kaggle job at start-up.',
              'The Kaggle job downloads and extracts it into scratch storage at start-up. You can also open the link or start the browser download here.'
          )
          html.write_text(h, encoding='utf-8')

      - name: Validate Python and JavaScript patch
        run: |
          python -m py_compile app.py kaggle_runner.py chem_core.py
          python - <<'PY'
          from pathlib import Path
          s = Path('static/js/app.js').read_text(encoding='utf-8')
          assert 'CHEMLAB KAGGLE BROWSER UPGRADE 2026-08-10' in s
          assert 'Load kaggle.json' in s
          assert 'Download ORCA in browser' in s
          assert 'Sync account jobs' in s
          print('Browser upgrade checks passed')
          PY

      - name: Commit patched files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/app.js templates/index.html
          git diff --cached --quiet || git commit -m 'Improve Kaggle browser login and cross-browser job recovery'
          git push

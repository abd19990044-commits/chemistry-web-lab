name: Remove deployment-time renderer overwrite

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Remove old renderer overwrite from HF deployment workflow
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('.github/workflows/hf-sync.yml')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\n      - name: Apply and commit deterministic molecule renderer fix\n.*?\n      - name: Validate deployment files',
              re.S,
          )
          replacement = '\n      - name: Validate deployment files'
          ns, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Old deployment-time renderer overwrite was not found; refusing unsafe edit')
          p.write_text(ns, encoding='utf-8')
          print('Removed deployment-time renderer overwrite')

      - name: Validate workflow
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'Apply and commit deterministic molecule renderer fix' .github/workflows/hf-sync.yml
          grep -q 'Upload repository to Hugging Face Space' .github/workflows/hf-sync.yml
          echo 'HF deployment workflow validation passed'

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/hf-sync.yml
          git add -u .github/workflows/fix-hf-deploy-workflow.yml
          git diff --cached --quiet || git commit -m 'fix: stop deployment from overwriting renderer'
          git push

name: Production harden Kaggle-native ORCA

on:
  push:
    paths:
      - '.github/workflows/production-harden-kaggle-native.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production hardening patch
        run: python .github/scripts/production_hardening_kaggle_native.py
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production path
        run: |
          python -m py_compile \
            orca_orchestrator/callback_auth.py \
            orca_orchestrator/api.py \
            orca_orchestrator/service.py \
            orca_orchestrator/watchdog.py \
            orca_orchestrator/runner/builder.py \
            orca_orchestrator/runner/kernel_runner.py
      - name: Run Kaggle-native production regressions
        env:
          ORCA_CALLBACK_SECRET: test-only-callback-secret-0123456789abcdef
          ORCA_LOCAL_MODE: '1'
        run: |
          pytest -q \
            tests/test_kaggle_native_production.py \
            tests/test_continuation.py \
            tests/test_lifecycle_simulation.py \
            tests/test_end_to_end_chain.py \
            tests/test_orca_builder.py \
            tests/test_account_control.py
      - name: Verify no runtime Cloudflare dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          svc = Path('orca_orchestrator/service.py').read_text()
          wd = Path('orca_orchestrator/watchdog.py').read_text()
          runner = Path('orca_orchestrator/runner/kernel_runner.py').read_text()
          assert 'CloudflareController' not in svc
          assert 'self.cf_controller' not in svc
          assert 'credential_vault' not in wd
          assert 'get_vault_manager' not in wd
          assert 'callback_token_sha256' in runner
          assert 'durable_epoch = EPOCH + 1' in runner
          print('runtime is Cloudflare-free and handoff/callback guards are present')
          PY
      - name: Commit verified production hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .env.example \
            orca_orchestrator/callback_auth.py \
            orca_orchestrator/service.py \
            orca_orchestrator/watchdog.py \
            orca_orchestrator/runner/kernel_runner.py \
            tests/test_kaggle_native_production.py
          git commit -m 'fix: production-harden Kaggle-native ORCA orchestration'
          git push origin HEAD:main

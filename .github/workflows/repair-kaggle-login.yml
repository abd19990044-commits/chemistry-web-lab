name: Repair Kaggle login flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-kaggle-login.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply login-flow repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('kaggle_runner.py')
          s = p.read_text(encoding='utf-8')
          if 'def verify_kaggle_credentials(' not in s:
              marker = '\ndef list_jobs(kaggle_username: str, kaggle_key: str) -> list[dict]:\n'
              if marker not in s:
                  raise SystemExit('Could not find list_jobs() insertion point in kaggle_runner.py')
              fn = r'''

def verify_kaggle_credentials(kaggle_username: str, kaggle_key: str) -> dict:
    """Fast Kaggle authentication check used by the web sign-in endpoint."""
    auth = resolve_kaggle_auth(kaggle_username, kaggle_key)
    with _temp_kaggle_env(kaggle_username, kaggle_key) as env:
        result = _run_kaggle_cli(
            ["kaggle", "kernels", "list", "--mine", "--csv",
             "--page-size", "1", "--page", "1"],
            env=env, timeout=30, attempts=2, base_delay=1.0,
        )
        combined = (result.stdout or "") + "\n" + (result.stderr or "")
        if result.returncode != 0:
            _raise_if_cli_broken(combined)
            _raise_if_unreachable(combined)
            low = combined.lower()
            if ("401" in combined or "unauthorized" in low
                    or "authentication required" in low or "forbidden" in low):
                raise RuntimeError(
                    "Kaggle rejected these credentials. Check the username and API key/token and try again."
                )
            raise RuntimeError((result.stderr or result.stdout
                                or "Kaggle credential verification failed.").strip())
    return {"username": auth["username"]}
'''
              s = s.replace(marker, fn + marker, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          start = s.find('@app.route("/api/kaggle/login", methods=["POST"])')
          end = s.find('@app.route("/api/kaggle/submit", methods=["POST"])', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate Kaggle login/submit routes in app.py')
          route = r'''@app.route("/api/kaggle/login", methods=["POST"])
def api_kaggle_login():
    """Fast credential verification only; job recovery is separate."""
    data = request.get_json(force=True, silent=True) or {}
    kaggle_username = (data.get("kaggle_username") or "").strip()
    kaggle_key = (data.get("kaggle_key") or "").strip()
    kaggle_username, kaggle_key = kaggle_runner.clean_kaggle_credentials(kaggle_username, kaggle_key)
    if not kaggle_username or not kaggle_key:
        return error_response("Please enter your Kaggle username and API key/token.")
    try:
        auth = kaggle_runner.verify_kaggle_credentials(kaggle_username, kaggle_key)
        log.info("kaggle credentials verified", extra={"event": "signed_in"})
        return jsonify({"ok": True, "username": auth["username"]})
    except (kaggle_runner.KaggleCliUnavailable, kaggle_runner.KaggleUnreachable) as exc:
        log.error("kaggle credential verification unavailable:\n%s", traceback.format_exc())
        return error_response(str(exc), 503)
    except Exception as exc:  # noqa: BLE001
        log.error("api_kaggle_login failed:\n%s", traceback.format_exc())
        message = str(exc).strip() or "Kaggle credential verification failed."
        return error_response(f"Could not sign in to Kaggle: {message}", 401)


@app.route("/api/kaggle/sync", methods=["POST"])
def api_kaggle_sync():
    """Recover Chemistry Lab jobs from Kaggle after authentication."""
    data = request.get_json(force=True, silent=True) or {}
    kaggle_username = (data.get("kaggle_username") or "").strip()
    kaggle_key = (data.get("kaggle_key") or "").strip()
    kaggle_username, kaggle_key = kaggle_runner.clean_kaggle_credentials(kaggle_username, kaggle_key)
    if not kaggle_username or not kaggle_key:
        return error_response("Missing Kaggle username or API key/token.")
    try:
        jobs = kaggle_runner.list_jobs(kaggle_username, kaggle_key)
        return jsonify({"ok": True, "jobs": jobs})
    except (kaggle_runner.KaggleCliUnavailable, kaggle_runner.KaggleUnreachable) as exc:
        log.error("kaggle sync unavailable:\n%s", traceback.format_exc())
        return error_response(str(exc), 503)
    except Exception as exc:  # noqa: BLE001
        log.error("api_kaggle_sync failed:\n%s", traceback.format_exc())
        return error_response(f"Could not synchronize Kaggle jobs: {exc}", 502)


'''
          s = s[:start] + route + s[end:]
          p.write_text(s, encoding='utf-8')

          candidates = list(Path('static').rglob('*.js')) + list(Path('templates').rglob('*.js'))
          js = None
          for f in candidates:
              text = f.read_text(encoding='utf-8', errors='replace')
              if 'const kaggleLoginForm' in text and 'function attemptLogin' in text:
                  js = f
                  break
          if js is None:
              raise SystemExit('Could not locate the Chemistry Lab browser JS file')
          s = js.read_text(encoding='utf-8')

          old_post = '''  async function postJSON(url, body) {
    const resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await resp.json().catch(() => ({ ok: false, error: "Invalid response from server." }));
    if (!resp.ok || !data.ok) throw new Error(data.error || "An unexpected error occurred.");
    return data;
  }'''
          new_post = '''  async function postJSON(url, body) {
    const resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const contentType = resp.headers.get("content-type") || "";
    let data = null;
    if (contentType.includes("application/json")) {
      data = await resp.json().catch(() => null);
    } else {
      const text = await resp.text().catch(() => "");
      const detail = text.replace(/<[^>]+>/g, " ").replace(/\\s+/g, " ").trim().slice(0, 240);
      throw new Error(`Server returned HTTP ${resp.status}${detail ? `: ${detail}` : "."}`);
    }
    if (!data) throw new Error(`Server returned HTTP ${resp.status} with an invalid JSON response.`);
    if (!resp.ok || !data.ok) throw new Error(data.error || `Request failed (HTTP ${resp.status}).`);
    return data;
  }'''
          if old_post not in s:
              raise SystemExit('Expected postJSON implementation not found')
          s = s.replace(old_post, new_post, 1)

          a = s.find('  async function attemptLogin(username, key, opts) {')
          b = s.find('\n  // If credentials were remembered from a previous visit', a)
          if a < 0 or b < 0:
              raise SystemExit('Could not locate attemptLogin()')
          attempt = '''  async function syncKaggleJobs(username, key, opts = {}) {
    const silent = !!opts.silent;
    try {
      const data = await postJSON("/api/kaggle/sync", { kaggle_username: username, kaggle_key: key });
      mergeRemoteJobs(username, key, data.jobs || []);
      pollAllActiveJobs();
      return true;
    } catch (err) {
      if (!silent) showToast(`<strong>Kaggle job sync failed</strong><br>${err.message}`);
      else console.warn("Kaggle job sync failed:", err.message);
      return false;
    }
  }

  async function attemptLogin(username, key, opts) {
    const silent = opts && opts.silent;
    if (!silent) { hide(kaggleLoginError); show(kaggleLoginLoading); }
    try {
      const data = await postJSON("/api/kaggle/login", { kaggle_username: username, kaggle_key: key });
      const verifiedUsername = data.username || username;
      setSignedIn(verifiedUsername, key);
      sessionKaggleKey = key;
      syncKaggleJobs(verifiedUsername, key, { silent: true });
      return true;
    } catch (err) {
      if (!silent) showError(kaggleLoginError, err.message);
      return false;
    } finally {
      if (!silent) hide(kaggleLoginLoading);
    }
  }
'''
          s = s[:a] + attempt + s[b:]
          s = s.replace("postJSON('/api/kaggle/login', {kaggle_username: currentKaggle.username, kaggle_key: currentKaggle.key})",
                        "postJSON('/api/kaggle/sync', {kaggle_username: currentKaggle.username, kaggle_key: currentKaggle.key})")
          js.write_text(s, encoding='utf-8')
          print('Repair applied to', js)
          PY

      - name: Validate Python syntax
        run: python -m py_compile app.py kaggle_runner.py

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py kaggle_runner.py static templates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Kaggle login and background job sync [skip ci]"
          git push

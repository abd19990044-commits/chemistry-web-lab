name: ORCA listing follow-up

on:
  push:
    paths:
      - '.github/workflows/orca-listing-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded patch
        run: python .github/scripts/apply_orca_listing_followup.py
      - name: Compile and focused checks
        shell: bash
        run: |
          python -m py_compile orca_orchestrator/service.py orca_orchestrator/cloudflare_controller/controller.py
          python - <<'PY'
          from pathlib import Path
          svc = Path('orca_orchestrator/service.py').read_text()
          ctl = Path('orca_orchestrator/cloudflare_controller/controller.py').read_text()
          assert 'status_query_failed = False' in ctl
          assert 'preserved last durable state' in ctl
          assert 'LocalWorkflowState.REMOTE_DELETED.value' in ctl
          assert 'Kaggle bulk job listing degraded; serving durable metadata' in svc
          assert 'step_datasets = list(parent_manifest.dataset_sources or [])' in svc
          print('follow-up checks passed')
          PY
      - name: Commit verified fixes
        shell: bash
        run: |
          if git diff --quiet -- orca_orchestrator; then exit 0; fi
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orca_orchestrator/service.py orca_orchestrator/cloudflare_controller/controller.py
          git commit -m 'fix: preserve jobs across Kaggle API/listing failures'
          git push

name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-deploy
  cancel-in-progress: false

env:
  HF_SPACE: mc2hf1999/orcaweb
  HF_ENDPOINT: https://huggingface.co

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f requirements.txt
          test -f app.py
          grep -Eq 'EXPOSE[[:space:]]+7860|0\.0\.0\.0:7860|:7860' Dockerfile
          test -d orca_orchestrator
          test -d templates
          test -d static
          python -m py_compile app.py chem_core.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Hugging Face Hub client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --retries 6 --timeout 60 -U "huggingface_hub>=0.35.0"

      - name: Authenticate and verify target Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN}" || { echo "ERROR: GitHub Actions secret HF_TOKEN is missing."; exit 1; }
          python - <<'PY'
          import os
          import time
          from huggingface_hub import HfApi

          api = HfApi(endpoint=os.environ["HF_ENDPOINT"], token=os.environ["HF_TOKEN"])
          last_error = None
          for attempt in range(1, 6):
              try:
                  who = api.whoami()
                  info = api.repo_info(repo_id=os.environ["HF_SPACE"], repo_type="space")
                  print("Authenticated Hugging Face account:", who.get("name") or who.get("fullname") or "<redacted>")
                  print("Target Space:", info.id)
                  print("Target Space SHA before deploy:", info.sha)
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Hugging Face preflight attempt {attempt}/5 failed: {type(exc).__name__}: {exc}")
                  if attempt < 5:
                      time.sleep(10 * attempt)
          else:
              raise RuntimeError(f"Hugging Face preflight failed after 5 attempts: {last_error}")
          PY

      - name: Upload repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          from huggingface_hub import HfApi

          repo_id = os.environ["HF_SPACE"]
          api = HfApi(endpoint=os.environ["HF_ENDPOINT"], token=os.environ["HF_TOKEN"])
          commit = None
          last_error = None
          for attempt in range(1, 6):
              try:
                  commit = api.upload_folder(
                      folder_path=".",
                      repo_id=repo_id,
                      repo_type="space",
                      revision="main",
                      commit_message=f"Deploy GitHub {os.environ['GITHUB_SHA'][:12]}",
                      commit_description=(
                          f"Automated deployment from {os.environ['GITHUB_REPOSITORY']}\n"
                          f"GitHub commit: {os.environ['GITHUB_SHA']}"
                      ),
                      ignore_patterns=[
                          ".git/**", ".github/**", "**/__pycache__/**", "**/*.pyc",
                          "**/*.pyo", ".env", ".env.*", "*.sqlite3", "*.db",
                          ".state/**", "*.log",
                      ],
                      delete_patterns="*",
                  )
                  print("Hugging Face commit created:", commit.oid)
                  print("Hugging Face commit URL:", commit.commit_url)
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Hugging Face upload attempt {attempt}/5 failed: {type(exc).__name__}: {exc}")
                  if attempt < 5:
                      time.sleep(15 * attempt)
          if commit is None:
              raise RuntimeError(f"Hugging Face upload failed after 5 attempts: {last_error}")
          PY

      - name: Verify deployed revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          from huggingface_hub import HfApi

          api = HfApi(endpoint=os.environ["HF_ENDPOINT"], token=os.environ["HF_TOKEN"])
          last_error = None
          for attempt in range(1, 6):
              try:
                  info = api.repo_info(repo_id=os.environ["HF_SPACE"], repo_type="space")
                  print("Deployed Space SHA:", info.sha)
                  if not info.sha:
                      raise RuntimeError("Hugging Face returned no Space revision SHA.")
                  print("GitHub commit submitted:", os.environ["GITHUB_SHA"])
                  print("Deployment upload completed successfully.")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Hugging Face verification attempt {attempt}/5 failed: {type(exc).__name__}: {exc}")
                  if attempt < 5:
                      time.sleep(10 * attempt)
          else:
              raise RuntimeError(f"Hugging Face verification failed after 5 attempts: {last_error}")
          PY

# Deployment pipeline validated and retriggered after the previous HF network failure.

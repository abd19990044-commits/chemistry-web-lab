name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-deploy
  cancel-in-progress: false

env:
  HF_SPACE: mc2hf1999/orcaweb

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f requirements.txt
          test -f app.py
          test -f publication_bootstrap.py
          grep -Eq 'EXPOSE[[:space:]]+7860|0\.0\.0\.0:7860|:7860' Dockerfile
          test -d orca_orchestrator
          test -d templates
          test -d static
          python -m py_compile app.py chem_core.py publication_bootstrap.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Sync repository to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ env.HF_SPACE }}
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: docker

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Hugging Face Hub client
        run: python -m pip install --disable-pip-version-check --no-cache-dir -U "huggingface_hub>=0.35.0"
      - name: Verify target Space revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: python
        run: |
          import os
          import sys
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("ERROR: GitHub Actions secret HF_TOKEN is missing.")
          api = HfApi(token=token)
          info = api.repo_info(repo_id="mc2hf1999/orcaweb", repo_type="space")
          print("Hugging Face Space:", info.id)
          print("Deployed revision:", info.sha)
          if not info.sha:
              raise SystemExit("Hugging Face returned no Space revision SHA.")

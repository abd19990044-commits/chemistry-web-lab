name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f requirements.txt
          test -f app.py
          grep -q '7860' Dockerfile
          echo "Deployment files look valid."

      - name: Sync to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: mc2hf1999/orcaweb
          repo_type: space
          space_sdk: docker
          hf_token: ${{ secrets.HF_TOKEN }}

name: Apply SVG renderer and HF sync fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Apply publication patch
        run: python tools/patch_publication.py

      - name: Validate
        run: |
          set -euo pipefail
          python -m py_compile chem_core.py app.py
          grep -q 'def render_molecule_svg' chem_core.py
          grep -q 'def render_reaction_svg' chem_core.py
          grep -q 'image_svg_base64' app.py
          grep -q 'explorer-download-svg' static/js/app.js
          grep -q 'reaction-download-svg' templates/index.html
          echo 'Publication SVG patch syntax and integration checks: OK'

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chem_core.py app.py static/js/app.js templates/index.html
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'feat: add vector SVG publication output'
            git push
          fi

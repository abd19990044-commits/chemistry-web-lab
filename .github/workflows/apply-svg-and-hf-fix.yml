name: Apply SVG renderer and HF sync fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Patch publication SVG renderer and downloads
        shell: python
        run: |
          from pathlib import Path
          import re

          core = Path('chem_core.py')
          s = core.read_text(encoding='utf-8')

          marker = '\n\n# ---------------------------------------------------------------------------\n# Small molecules are written, not drawn\n'
          if 'def render_molecule_svg(' not in s:
              svg_code = r'''


def render_molecule_svg(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE) -> bytes | None:
    """Render the molecule as true vector SVG for publication workflows.

    Unlike PNG, SVG has no raster DPI ceiling: bonds, atom labels and legends
    remain mathematically scalable at any journal figure size.
    """
    mol = Chem.MolFromSmiles(smiles)
    if mol is None:
        return None
    try:
        AllChem.Compute2DCoords(mol)
        Chem.rdDepictor.StraightenDepiction(mol)
    except Exception:
        pass
    drawer = rdMolDraw2D.MolDraw2DSVG(size[0], size[1])
    _apply_common_draw_options(drawer)
    opts = drawer.drawOptions()
    try:
        opts.fixedBondLength = 90.0
        opts.fixedFontSize = 60.0
        opts.minFontSize = 48.0
        opts.maxFontSize = 66.0
        opts.padding = 0.05
    except Exception:
        pass
    try:
        drawer.SetFontSize(60)
    except Exception:
        pass
    rdMolDraw2D.PrepareAndDrawMolecule(drawer, mol, legend=legend)
    drawer.FinishDrawing()
    return drawer.GetDrawingText().encode("utf-8")


def _molecule_svg_fragment(smiles: str, width: int = 900, height: int = 720) -> str | None:
    mol = Chem.MolFromSmiles(smiles)
    if mol is None:
        return None
    try:
        AllChem.Compute2DCoords(mol)
        Chem.rdDepictor.StraightenDepiction(mol)
    except Exception:
        pass
    drawer = rdMolDraw2D.MolDraw2DSVG(width, height)
    _apply_common_draw_options(drawer)
    opts = drawer.drawOptions()
    try:
        opts.fixedBondLength = 70.0
        opts.fixedFontSize = 46.0
        opts.minFontSize = 34.0
        opts.maxFontSize = 52.0
        opts.padding = 0.08
    except Exception:
        pass
    rdMolDraw2D.PrepareAndDrawMolecule(drawer, mol)
    drawer.FinishDrawing()
    raw = drawer.GetDrawingText()
    start = raw.find('>') + 1
    end = raw.rfind('</svg>')
    return raw[start:end] if start > 0 and end > start else None


def _svg_formula_markup(formula: str, x: int, y: int, font_size: int = 88) -> str:
    tokens = _formula_tokens(formula)
    parts = [f'<text x="{x}" y="{y}" font-family="Arial,Helvetica,sans-serif" '
             f'font-size="{font_size}" fill="#141414">']
    for text, style in tokens:
        if style == "sub":
            parts.append(f'<tspan font-size="{int(font_size*0.62)}" baseline-shift="sub">{text}</tspan>')
        elif style == "sup":
            parts.append(f'<tspan font-size="{int(font_size*0.62)}" baseline-shift="super">{text}</tspan>')
        else:
            parts.append(text)
    parts.append('</text>')
    return ''.join(parts)


def render_reaction_svg(reactant_pairs, product_pairs, small_as_formula: bool = True) -> bytes | None:
    """Render a reaction scheme as genuine vector SVG.

    Structures are RDKit SVG paths; formulas, coefficients and the reaction
    arrow are SVG text/geometry. No PNG is embedded in the SVG.
    """
    tokens = []
    for side_index, pairs in enumerate((reactant_pairs, product_pairs)):
        if side_index:
            tokens.append(("arrow", None))
        for i, (coefficient, smiles) in enumerate(pairs):
            if i:
                tokens.append(("op", "+"))
            formula = formula_for_display(smiles) if small_as_formula else None
            if formula:
                tokens.append(("formula", formula))
            else:
                fragment = _molecule_svg_fragment(smiles)
                if fragment is None:
                    return None
                tokens.append(("mol", fragment))
            label = ReactionTerm(Fraction(coefficient), "").pretty_coefficient
            if label:
                tokens.append(("coefficient", label))

    if not tokens:
        return None

    gap = 54
    mol_w, mol_h = 900, 720
    widths = []
    for kind, payload in tokens:
        if kind == "mol":
            widths.append(mol_w)
        elif kind == "formula":
            widths.append(max(250, 70 * len(payload) + 100))
        elif kind == "coefficient":
            widths.append(110)
        elif kind == "op":
            widths.append(90)
        else:
            widths.append(260)
    total_width = sum(widths) + gap * (len(tokens) - 1) + 120
    total_height = 900

    out = [f'<svg xmlns="http://www.w3.org/2000/svg" width="{total_width}" height="{total_height}" '
           f'viewBox="0 0 {total_width} {total_height}">',
           '<rect width="100%" height="100%" fill="white"/>',
           '<style>text{font-family:Arial,Helvetica,sans-serif;fill:#141414}</style>']
    x = 60
    center = total_height // 2
    for kind, payload in tokens:
        if kind == "mol":
            out.append(f'<g transform="translate({x},{center-mol_h//2})">{payload}</g>')
        elif kind == "formula":
            out.append(_svg_formula_markup(payload, x + 35, center + 30, 88))
        elif kind == "coefficient":
            out.append(f'<text x="{x}" y="{center+30}" font-size="76" font-weight="600">{payload}</text>')
        elif kind == "op":
            out.append(f'<text x="{x}" y="{center+30}" font-size="82">+</text>')
        else:
            y = center
            out.append(f'<line x1="{x}" y1="{y}" x2="{x+190}" y2="{y}" stroke="#141414" stroke-width="6"/>')
            out.append(f'<path d="M {x+190} {y} L {x+158} {y-22} L {x+158} {y+22} Z" fill="#141414"/>')
        x += widths[tokens.index((kind, payload))] + gap
    out.append('</svg>')
    return ''.join(out).encode('utf-8')
'''
              if marker not in s:
                  raise SystemExit('Could not locate chem_core insertion marker')
              s = s.replace(marker, svg_code + marker, 1)
          core.write_text(s, encoding='utf-8')

          app = Path('app.py')
          s = app.read_text(encoding='utf-8')
          old = '        mol_bytes = core.generate_mol_file_bytes(smiles)\n'
          new = '        mol_bytes = core.generate_mol_file_bytes(smiles)\n        svg_bytes = core.render_molecule_svg(smiles)\n'
          if 'svg_bytes = core.render_molecule_svg(smiles)' not in s:
              if old not in s: raise SystemExit('Molecule insertion point missing')
              s = s.replace(old, new, 1)
          old = '            "image_png_base64": b64(image_bytes),\n            "mol_file_base64": b64(mol_bytes),\n'
          new = '            "image_png_base64": b64(image_bytes),\n            "image_svg_base64": b64(svg_bytes),\n            "mol_file_base64": b64(mol_bytes),\n'
          if '"image_svg_base64": b64(svg_bytes)' not in s:
              if old not in s: raise SystemExit('Molecule payload insertion point missing')
              s = s.replace(old, new, 1)

          old = '        image_bytes = core.render_reaction_png(as_pairs(reactant_terms), as_pairs(product_terms),\n                                               small_as_formula=small_as_formula)\n'
          new = old + '        svg_bytes = core.render_reaction_svg(as_pairs(reactant_terms), as_pairs(product_terms),\n                                               small_as_formula=small_as_formula)\n'
          if 'svg_bytes = core.render_reaction_svg(' not in s:
              if old not in s: raise SystemExit('Reaction insertion point missing')
              s = s.replace(old, new, 1)
          old = '            "image_png_base64": b64(image_bytes),\n            "rxn_file_base64": b64(rxn_bytes),\n'
          new = '            "image_png_base64": b64(image_bytes),\n            "image_svg_base64": b64(svg_bytes),\n            "rxn_file_base64": b64(rxn_bytes),\n'
          # second occurrence only: replace after reaction section marker
          pos = s.find('def api_reaction')
          tail = s[pos:]
          if '"image_svg_base64": b64(svg_bytes)' not in tail:
              if old not in tail: raise SystemExit('Reaction payload insertion point missing')
              tail = tail.replace(old, new, 1)
              s = s[:pos] + tail
          app.write_text(s, encoding='utf-8')

          js_path = Path('static/js/app.js')
          js = js_path.read_text(encoding='utf-8')
          js_old = 'setDownload(document.getElementById("explorer-download-mol"), data.mol_file_base64, "chemical/x-mdl-molfile", `${data.filename}.mol`);'
          js_new = js_old + '\n      setDownload(document.getElementById("explorer-download-svg"), data.image_svg_base64, "image/svg+xml", `${data.filename}.svg`);'
          if 'explorer-download-svg' not in js:
              if js_old not in js: raise SystemExit('Explorer JS insertion point missing')
              js = js.replace(js_old, js_new, 1)
          js_old = 'setDownload(document.getElementById("reaction-download-rxn"), data.rxn_file_base64, "chemical/x-mdl-rxnfile", "reaction.rxn");'
          js_new = js_old + '\n      setDownload(document.getElementById("reaction-download-svg"), data.image_svg_base64, "image/svg+xml", "reaction.svg");'
          if 'reaction-download-svg' not in js:
              if js_old not in js: raise SystemExit('Reaction JS insertion point missing')
              js = js.replace(js_old, js_new, 1)
          js_path.write_text(js, encoding='utf-8')

          html = Path('templates/index.html')
          h = html.read_text(encoding='utf-8')
          old = '<a id="explorer-download-mol" class="btn btn-ghost btn-small" download>⬇ Download MOL file</a>'
          new = old + '\n          <a id="explorer-download-svg" class="btn btn-outline btn-small" download>⬇ Download SVG</a>'
          if 'explorer-download-svg' not in h:
              if old not in h: raise SystemExit('Explorer HTML insertion point missing')
              h = h.replace(old, new, 1)
          old = '<a id="reaction-download-rxn" class="btn btn-ghost btn-small" download>⬇ Download RXN file</a>'
          new = old + '\n          <a id="reaction-download-svg" class="btn btn-outline btn-small" download>⬇ Download SVG</a>'
          if 'reaction-download-svg' not in h:
              if old not in h: raise SystemExit('Reaction HTML insertion point missing')
              h = h.replace(old, new, 1)
          html.write_text(h, encoding='utf-8')

      - name: Validate Python and frontend
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile chem_core.py app.py
          python - <<'PY'
          import chem_core as c
          x = c.render_molecule_svg('CCO')
          assert x and b'<svg' in x and b'<path' in x
          r = c.render_reaction_svg([(1, 'CCO')], [(1, 'O')], True)
          assert r and b'<svg' in r
          print('SVG renderer smoke test: OK')
          PY

      - name: Patch Hugging Face deployment to official sync action
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/hf-sync.yml')
          s = p.read_text(encoding='utf-8')
          start = s.index('      - name: Install Hugging Face Hub client')
          replacement = '''      - name: Sync repository to Hugging Face Space\n        uses: huggingface/hub-sync@v0.1.0\n        with:\n          github_repo_id: ${{ github.repository }}\n          huggingface_repo_id: ${{ env.HF_SPACE }}\n          hf_token: ${{ secrets.HF_TOKEN }}\n          repo_type: space\n          space_sdk: docker\n\n      - name: Verify deployed revision\n        env:\n          HF_TOKEN: ${{ secrets.HF_TOKEN }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          python -m pip install --disable-pip-version-check --no-cache-dir -U "huggingface_hub>=0.35.0"\n          python - <<'PY'\n          import os\n          from huggingface_hub import HfApi\n          api = HfApi(token=os.environ["HF_TOKEN"])\n          info = api.repo_info(repo_id=os.environ["HF_SPACE"], repo_type="space")\n          print(f"Deployed Space SHA: {info.sha}")\n          if not info.sha:\n              raise SystemExit("Hugging Face returned no Space revision SHA")\n          print("Deployment verified successfully.")\n          PY\n'''
          s = s[:start] + replacement
          p.write_text(s, encoding='utf-8')

      - name: Commit all fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chem_core.py app.py static/js/app.js templates/index.html .github/workflows/hf-sync.yml
          git commit -m 'feat: add vector SVG publication output and robust HF deployment'
          git push

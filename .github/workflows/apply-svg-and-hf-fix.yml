name: Apply SVG renderer and HF sync fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Apply publication patch
        run: python tools/patch_publication.py

      - name: Validate
        run: |
          python -m py_compile chem_core.py app.py
          python - <<'PY'
          import traceback
          import chem_core as c
          for label, fn in [
              ('molecule SVG', lambda: c.render_molecule_svg('CCO')),
              ('reaction SVG', lambda: c.render_reaction_svg([(1, 'CCO')], [(1, 'O')], True)),
          ]:
              try:
                  value = fn()
                  print(label, 'type=', type(value).__name__, 'bytes=', len(value or b''))
                  print((value or b'')[:120])
                  if not value or b'<svg' not in value:
                      raise RuntimeError('SVG output missing <svg> marker')
              except Exception:
                  print(label, 'FAILED')
                  traceback.print_exc()
                  raise
          print('SVG smoke test: OK')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chem_core.py app.py static/js/app.js templates/index.html
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'feat: add vector SVG publication output'
            git push
          fi

name: One-time Kaggle credentials UI wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Load browser-local credentials UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="{{ url_for(\'static\', filename=\'js/kaggle_credentials.js\') }}"></script>'
          anchor = '<script src="{{ url_for(\'static\', filename=\'js/app.js\') }}"></script>'
          if tag not in s:
              if anchor not in s:
                  raise SystemExit('app.js script tag not found')
              s = s.replace(anchor, anchor + '\n' + tag)
              p.write_text(s, encoding='utf-8')
          print('Kaggle credentials UI wired')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('templates/index.html').read_text(encoding='utf-8')
          assert 'js/kaggle_credentials.js' in s
          assert Path('static/js/kaggle_credentials.js').exists()
          print('Validation passed')
          PY
      - name: Commit and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html static/js/kaggle_credentials.js
          git add -u .github/workflows/one-time-kaggle-credentials-ui.yml
          git diff --cached --quiet || git commit -m 'Persist Kaggle credentials per browser with explicit controls'
          git push

name: One-time drawing upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply publication-quality RDKit renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('chem_core.py')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              'from rdkit.Chem import AllChem, rdMolDescriptors, rdChemReactions\n',
              'from rdkit.Chem import AllChem, rdMolDescriptors, rdChemReactions, rdDepictor, rdCoordGen\n'
          )

          text = text.replace(
              'MOL_IMAGE_SIZE = (560, 420)\nREACTION_SUBIMAGE_SIZE = (420, 340)\nDRAWING_BOND_LINE_WIDTH = 2\nDRAWING_FONT_SCALE = 0.85\n',
              'MOL_IMAGE_SIZE = (900, 700)\nREACTION_SUBIMAGE_SIZE = (520, 400)\nDRAWING_BOND_LINE_WIDTH = 2.2\nDRAWING_FONT_SCALE = 0.95\nDRAWING_PADDING = 0.08\n'
          )

          new_renderer = r'''def _prepare_publication_molecule(smiles: str):
    """Parse and prepare a molecule for stable, publication-quality 2D depiction.

    The reference drawing bot uses RDKit's coordinate generation plus depiction
    straightening. We keep that approach but prefer CoordGen when available,
    sanitize explicitly, and preserve stereochemistry. The function is kept
    deterministic so the same SMILES produces the same figure across requests.
    """
    mol = Chem.MolFromSmiles(smiles)
    if mol is None:
        return None
    try:
        Chem.SanitizeMol(mol)
    except Exception:  # noqa: BLE001
        return None

    # CoordGen generally gives cleaner fused-ring and heterocycle layouts than
    # the legacy distance-geometry 2D depiction. Fall back to RDKit's standard
    # coordinates for unusual structures or older RDKit builds.
    try:
        rdCoordGen.AddCoords(mol)
    except Exception:  # noqa: BLE001
        try:
            rdDepictor.Compute2DCoords(mol, canonOrient=True)
        except Exception:  # noqa: BLE001
            AllChem.Compute2DCoords(mol)

    try:
        rdDepictor.StraightenDepiction(mol)
    except Exception:  # noqa: BLE001
        pass
    return mol


def _apply_publication_draw_options(drawer) -> None:
    """Apply a restrained ACS-like scientific drawing style."""
    opts = drawer.drawOptions()
    opts.addStereoAnnotation = True
    opts.bondLineWidth = DRAWING_BOND_LINE_WIDTH
    opts.baseFontSize = DRAWING_FONT_SCALE
    opts.legendFontSize = 20
    opts.padding = DRAWING_PADDING
    opts.fixedBondLength = 38
    opts.multipleBondOffset = 0.16
    try:
        opts.minFontSize = 14
    except Exception:  # noqa: BLE001
        pass
    try:
        opts.annotationFontScale = 0.75
    except Exception:  # noqa: BLE001
        pass
    try:
        rdMolDraw2D.SetACS1996Mode(drawer)
    except Exception:  # noqa: BLE001
        # ACS mode is version-dependent; the explicit options above remain the
        # deterministic fallback on older RDKit releases.
        pass


def _trim_rendered_white(image, pad: int = 12):
    from PIL import Image, ImageChops
    bg = Image.new(image.mode, image.size, (255, 255, 255))
    box = ImageChops.difference(image, bg).getbbox()
    if not box:
        return image
    left, top, right, bottom = box
    return image.crop((max(0, left-pad), max(0, top-pad),
                       min(image.width, right+pad), min(image.height, bottom+pad)))


def render_molecule_png(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE) -> bytes | None:
    """Render a clean, high-resolution 2D chemical structure.

    Improvements over the older renderer are taken directly from the supplied
    Chemistry Drawing Bot: coordinate refinement, depiction straightening,
    consistent drawing options, and removal of excess white canvas. CoordGen is
    preferred for cleaner ring systems while retaining a safe RDKit fallback.
    """
    mol = _prepare_publication_molecule(smiles)
    if mol is None:
        return None
    try:
        drawer = rdMolDraw2D.MolDraw2DCairo(int(size[0]), int(size[1]))
        _apply_publication_draw_options(drawer)
        rdMolDraw2D.PrepareAndDrawMolecule(drawer, mol, legend=legend or "")
        drawer.FinishDrawing()
        from PIL import Image
        image = Image.open(io.BytesIO(drawer.GetDrawingText())).convert("RGB")
        image = _trim_rendered_white(image)
        out = io.BytesIO()
        image.save(out, format="PNG", optimize=True, dpi=(300, 300))
        return out.getvalue()
    except Exception as exc:  # noqa: BLE001
        logger.info("RDKit 2D rendering failed: %s", exc)
        return None


def render_molecule_svg(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE) -> bytes | None:
    """Vector version of the same renderer for publication/web export."""
    mol = _prepare_publication_molecule(smiles)
    if mol is None:
        return None
    try:
        drawer = rdMolDraw2D.MolDraw2DSVG(int(size[0]), int(size[1]))
        _apply_publication_draw_options(drawer)
        rdMolDraw2D.PrepareAndDrawMolecule(drawer, mol, legend=legend or "")
        drawer.FinishDrawing()
        return drawer.GetDrawingText().encode("utf-8")
    except Exception as exc:  # noqa: BLE001
        logger.info("RDKit SVG rendering failed: %s", exc)
        return None

'''

          pattern = re.compile(r'def render_molecule_png\(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE\) -> bytes \| None:\n.*?(?=\ndef _render_formula_image\()', re.S)
          if not pattern.search(text):
              raise SystemExit('Could not locate render_molecule_png block; refusing to modify the file.')
          text = pattern.sub(new_renderer, text, count=1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate renderer
        run: |
          python - <<'PY'
          from chem_core import render_molecule_png, render_molecule_svg
          for smi in ['CC(=O)Oc1ccccc1C(=O)O', 'C[C@H](O)C(=O)O', 'c1ccc2ccccc2c1']:
              png = render_molecule_png(smi)
              svg = render_molecule_svg(smi)
              assert png and png.startswith(b'\x89PNG'), smi
              assert svg and b'<svg' in svg, smi
          print('RDKit drawing smoke tests passed')
          PY
      - name: Commit upgrade and remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chem_core.py
          git rm .github/workflows/upgrade-drawing-once.yml
          git commit -m 'Improve RDKit chemical structure rendering' || exit 0
          git push

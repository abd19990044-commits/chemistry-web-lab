name: ORCA workflow and listing hotfix

on:
  push:
    paths:
      - '.github/workflows/orca-workflow-listing-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, f'{path}: expected exactly one match, found {count}'
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # API: workflow creation referenced an undefined local variable `steps`.
          replace_once(
              'orca_orchestrator/api.py',
              'res = service.submit_workflow(creds, title=title, steps=steps, dataset_sources=datasets, orca_link=orca_link)',
              'res = service.submit_workflow(creds, title=title, steps=payload.get("steps") or [], dataset_sources=datasets, orca_link=orca_link)'
          )

          # Service imports needed for deterministic workflow handoff.
          replace_once(
              'orca_orchestrator/service.py',
              'from dataclasses import dataclass\n',
              'from dataclasses import dataclass\nfrom typing import Any\n'
          )
          replace_once(
              'orca_orchestrator/service.py',
              'from .orca_artifacts import detect_job_kind\n',
              'from .orca_artifacts import (detect_job_kind, extract_charge_mult,\n                             read_trajectory_frames, set_geometry)\n'
          )

          # Cloudflare is durable metadata. Register BEFORE the remote side effect so a
          # Space crash after Kaggle accepts the push cannot create an invisible orphan.
          old = '''                self.store.put_job(job, expected_version=job._extra.get("_version"))\n\n                inline = {input_filename: input_content.encode("utf-8")}\n'''
          new = '''                self.store.put_job(job, expected_version=job._extra.get("_version"))\n\n                # Persist durable metadata BEFORE pushing to Kaggle. If this process dies\n                # after Kaggle accepts the notebook but before the HTTP request returns,\n                # My Jobs can still recover the job from Cloudflare on the next request.\n                try:\n                    self.cf_controller.register_job(\n                        job,\n                        workflow_id=workflow_id,\n                        parent_job_id=parent_job_id,\n                        step_index=step_index,\n                        step_count=step_count,\n                        step_name=step_name,\n                    )\n                except Exception as exc:\n                    log.warning("Could not pre-register job in Cloudflare control plane: %s", exc)\n\n                inline = {input_filename: input_content.encode("utf-8")}\n'''
          replace_once('orca_orchestrator/service.py', old, new)

          # After push, update the already-durable record instead of creating it for the
          # first time. sync_job_state preserves workflow/parent metadata.
          old = '''                # Persist metadata to Cloudflare Control Plane\n                try:\n                    self.cf_controller.register_job(\n                        job,\n                        workflow_id=workflow_id,\n                        parent_job_id=parent_job_id,\n                        step_index=step_index,\n                        step_count=step_count,\n                        step_name=step_name,\n                    )\n                except Exception as exc:\n                    log.warning("Could not register job in Cloudflare control plane: %s", exc)\n'''
          new = '''                # Finalise the durable metadata with the real Kaggle slug/URL.\n                try:\n                    self.cf_controller.sync_job_state(job)\n                except Exception as exc:\n                    log.warning("Could not sync pushed job to Cloudflare control plane: %s", exc)\n'''
          replace_once('orca_orchestrator/service.py', old, new)

          # My Jobs: absence from Kaggle's eventually-consistent bulk listing is NOT
          # proof of deletion. Use the exact Cloudflare reconciliation flag instead.
          old = '''        # 2. Discover jobs on Kaggle\n        remote = ledger_mod.discover_jobs(client)\n        merged = []\n'''
          new = '''        # Snapshot durable job metadata after exact per-job reconciliation.\n        try:\n            cf_by_ref = {j.kaggle_job_ref: j for j in self.cf_controller.client.list_user_jobs(creds.username)}\n        except Exception:\n            cf_by_ref = {}\n\n        # Reconciliation may have completed a workflow step. Launch at most one READY\n        # successor before reading the bulk Kaggle list; the newly submitted job is kept\n        # visible from local/Cloudflare metadata even while Kaggle listing catches up.\n        try:\n            self._drive_ready_workflows(creds)\n        except Exception as exc:\n            log.warning("Workflow driver degraded during job listing: %s", exc)\n\n        # 2. Discover jobs on Kaggle\n        remote = ledger_mod.discover_jobs(client)\n        merged = []\n'''
          replace_once('orca_orchestrator/service.py', old, new)

          old = '''        # 3. Include jobs in local store/Cloudflare that are no longer present on Kaggle\n        for job in self.store.list_jobs(creds.username):\n            if job.job_id not in seen:\n                seen.add(job.job_id)\n                described = self.describe(job)\n                described["deleted_on_kaggle"] = True\n                merged.append(described)\n'''
          new = '''        # 3. Include durable/local jobs not returned by the bulk Kaggle listing.\n        # `kernels list` is eventually consistent and occasionally incomplete, so an\n        # omission must never be translated into "deleted". Exact reconciliation of the\n        # Cloudflare record is the source of that flag.\n        for job in self.store.list_jobs(creds.username):\n            if job.job_id not in seen:\n                seen.add(job.job_id)\n                described = self.describe(job)\n                cf_rec = cf_by_ref.get(job.job_id)\n                described["not_returned_by_kaggle_listing"] = True\n                described["deleted_on_kaggle"] = bool(getattr(cf_rec, "remote_deleted", False))\n                merged.append(described)\n'''
          replace_once('orca_orchestrator/service.py', old, new)

          # Insert workflow execution helpers before the workflow public API.
          marker = '    # -- workflows ---------------------------------------------------------\n'
          p = Path('orca_orchestrator/service.py')
          text = p.read_text(encoding='utf-8')
          assert text.count(marker) == 1
          helpers = r'''    # -- workflow execution -------------------------------------------------
    def _workflow_result_payload(self, creds: KaggleCredentials, parent_job_id: str,
                                 step) -> tuple[str, dict[str, bytes]]:
        """Build the next step's input from the predecessor's *actual* result.

        The highest-value invariant for chemistry workflows is that FREQ/TD-DFT/SP must
        run on the geometry produced by OPT, not on the geometry that happened to be in
        the original template. Results are downloaded from the completed predecessor,
        the best complete XYZ frame is selected, and the next ORCA input is rewritten to
        an explicit xyzfile reference. Required small artefacts are carried too.
        """
        parent = self.store.get_job(parent_job_id)
        zip_path, cleanup_dir = self.fetch_results(creds, parent_job_id)
        if not zip_path or not os.path.exists(zip_path):
            raise ValidationError(
                "the predecessor finished but its Kaggle output is not available yet; "
                "the workflow will retry this READY step"
            )

        try:
            with zipfile.ZipFile(zip_path, "r") as zf:
                file_names = [n for n in zf.namelist() if not n.endswith("/")]
                xyz_names = [n for n in file_names if n.lower().endswith(".xyz")]
                if not xyz_names:
                    raise ValidationError(
                        "the predecessor result contains no XYZ geometry, so the next "
                        "calculation cannot be started safely"
                    )

                wanted = ""
                if parent and parent.input_filename:
                    wanted = os.path.splitext(os.path.basename(parent.input_filename))[0].lower() + ".xyz"

                def xyz_rank(name: str) -> tuple[int, str]:
                    base = os.path.basename(name).lower()
                    if wanted and base == wanted:
                        return (0, base)
                    if base == "last_geometry.xyz":
                        return (1, base)
                    if not base.endswith("_trj.xyz"):
                        return (2, base)
                    return (3, base)

                geometry_text = None
                geometry_source = None
                for name in sorted(xyz_names, key=xyz_rank):
                    try:
                        raw = zf.read(name).decode("utf-8", errors="replace")
                        frames = read_trajectory_frames(raw, is_text=True)
                    except Exception:
                        frames = []
                    if frames:
                        geometry_text = frames[-1].rstrip() + "\n"
                        geometry_source = name
                        break
                if not geometry_text:
                    raise ValidationError(
                        "XYZ files were present in the predecessor output, but none contained "
                        "a complete geometry frame"
                    )

                geom_name = f"workflow_step_{step.step_index}_geometry.xyz"
                aux = {geom_name: geometry_text.encode("utf-8")}

                # Explicitly requested artefacts are enforced here, at the point where the
                # bytes are available. The old prerequisite checker silently `pass`ed when
                # an artefact was missing, which allowed scientifically invalid steps.
                geometry_aliases = {"geometry", "xyz", "optimized_geometry", "optimised_geometry"}
                by_base = {os.path.basename(n).lower(): n for n in file_names}
                for requested in step.required_artifacts or []:
                    req = str(requested).strip()
                    if not req or req.lower() in geometry_aliases:
                        continue
                    match = by_base.get(os.path.basename(req).lower())
                    if not match:
                        matches = [n for n in file_names if n.lower().endswith(req.lower())]
                        match = matches[0] if matches else None
                    if not match:
                        raise ValidationError(
                            f"required workflow artefact '{req}' is absent from predecessor "
                            f"job {parent_job_id}"
                        )
                    data = zf.read(match)
                    # Kernel source has a hard size ceiling. Large wavefunctions/Hessians
                    # need a Dataset/remote transport rather than being embedded silently.
                    if len(data) > CONFIG.runner.inline_carry_limit_bytes // 2:
                        raise ValidationError(
                            f"required workflow artefact '{req}' is too large for safe inline "
                            "handoff; put it in a Kaggle Dataset or use a restartable single job"
                        )
                    aux[os.path.basename(match)] = data

            template = step.input_template or ""
            if not template.strip():
                raise ValidationError(f"workflow step {step.step_index} has no ORCA input template")
            charge, mult = extract_charge_mult(template)
            rewritten = set_geometry(template, geom_name, charge, mult)
            if rewritten == template and not re.search(r"(?i)\*\s*xyzfile\b", template):
                raise ValidationError(
                    "the next workflow step has no replaceable ORCA geometry block; include "
                    "a '* xyz charge multiplicity ... *' block in its input template"
                )
            return rewritten, aux
        finally:
            if cleanup_dir:
                shutil.rmtree(cleanup_dir, ignore_errors=True)

    def _drive_ready_workflows(self, creds: KaggleCredentials,
                               workflow_id: str | None = None) -> list[dict[str, Any]]:
        """Launch READY workflow steps exactly once.

        Cloudflare is used as the durable idempotency/fencing surface: if a job record for
        the same workflow+step already exists, the step is attached to that job instead of
        pushing a duplicate Kaggle notebook.
        """
        owner = creds.username.lower()
        workflows = ([self.cf_controller.get_workflow(workflow_id, owner)] if workflow_id
                     else self.cf_controller.list_user_workflows(owner))
        workflows = [wf for wf in workflows if wf is not None]
        try:
            jobs = self.cf_controller.client.list_user_jobs(owner)
        except Exception:
            jobs = []
        existing = {(j.workflow_id, int(j.step_index)): j for j in jobs if j.workflow_id}
        launched = []

        for wf in workflows:
            if wf.status in ("COMPLETED", "FAILED", "PAUSED"):
                continue
            for step in sorted(wf.steps, key=lambda s: s.step_index):
                if step.status != "READY":
                    continue

                prior = existing.get((wf.workflow_id, int(step.step_index)))
                if prior:
                    step.job_id = prior.kaggle_job_ref
                    if prior.local_state in ("COMPLETED", "REMOTE_COMPLETED"):
                        step.status = "COMPLETED"
                    elif prior.local_state in ("FAILED", "REMOTE_FAILED", "REMOTE_DELETED"):
                        step.status = "FAILED"
                    else:
                        step.status = "RUNNING"
                    wf.current_step_index = max(wf.current_step_index, step.step_index)
                    wf.updated_at = now()
                    self.cf_controller.client.put_workflow(wf)
                    break

                parent_step = None
                if step.prerequisites:
                    completed = [wf.get_step(i) for i in step.prerequisites]
                    completed = [s for s in completed if s and s.status == "COMPLETED" and s.job_id]
                    if completed:
                        parent_step = max(completed, key=lambda s: s.step_index)
                elif step.step_index > 0:
                    candidate = wf.get_step(step.step_index - 1)
                    if candidate and candidate.status == "COMPLETED" and candidate.job_id:
                        parent_step = candidate

                try:
                    if step.step_index > 0:
                        if parent_step is None:
                            raise ValidationError(
                                f"workflow step {step.step_index} is READY but has no completed "
                                "predecessor with a job id"
                            )
                        input_content, step_aux = self._workflow_result_payload(
                            creds, parent_step.job_id, step
                        )
                        parent_job_id = parent_step.job_id
                    else:
                        input_content = step.input_template
                        step_aux = {}
                        parent_job_id = None

                    launch_cfg = dict(wf.metadata.get("launch_config") or {})
                    sub = self.submit(
                        creds,
                        input_filename=f"{slugify(step.step_name) or 'step'}-{step.step_index}.inp",
                        input_content=input_content,
                        job_name=f"{wf.title}-{step.step_name}",
                        aux_files=step_aux,
                        dataset_sources=list(launch_cfg.get("dataset_sources") or []),
                        orca_link=launch_cfg.get("orca_link") or None,
                        idempotency_key=f"workflow:{wf.workflow_id}:step:{step.step_index}",
                        workflow_id=wf.workflow_id,
                        parent_job_id=parent_job_id,
                        step_index=step.step_index,
                        step_count=len(wf.steps),
                        step_name=step.step_name,
                    )
                except Exception as exc:
                    # Output availability is eventually consistent. Keep READY so the next
                    # list/watchdog pass retries rather than corrupting the workflow graph.
                    step.result_data["last_launch_error"] = f"{type(exc).__name__}: {exc}"
                    step.result_data["last_launch_attempt_at"] = now()
                    wf.updated_at = now()
                    self.cf_controller.client.put_workflow(wf)
                    log.warning("Could not launch READY workflow %s step %s: %s",
                                wf.workflow_id, step.step_index, exc)
                    break

                step.job_id = sub.job_id
                step.status = "RUNNING"
                step.result_data.pop("last_launch_error", None)
                wf.status = "IN_PROGRESS"
                wf.current_step_index = step.step_index
                wf.updated_at = now()
                self.cf_controller.client.put_workflow(wf)
                launched.append({"workflow_id": wf.workflow_id,
                                 "step_index": step.step_index,
                                 "job_id": sub.job_id})
                # Sequential chemistry workflow: one newly-launched step per workflow pass.
                break
        return launched

    def _reconcile_and_drive_workflows(self, creds: KaggleCredentials) -> None:
        """Watchdog hook: make workflows advance even when the browser is closed."""
        try:
            self.cf_controller.reconcile_user_session(creds, KaggleClient(creds))
            self._drive_ready_workflows(creds)
        except Exception as exc:
            log.warning("Background workflow reconciliation degraded: %s", exc)

'''
          text = text.replace(marker, helpers + marker, 1)
          p.write_text(text, encoding='utf-8')

          # Persist launch configuration in the durable workflow record and drive/refetch
          # workflows whenever their API is polled.
          old = '''        wf = self.cf_controller.register_workflow(title=title, owner=creds.username, step_specs=steps)\n\n        # Launch Step 0\n'''
          new = '''        wf = self.cf_controller.register_workflow(title=title, owner=creds.username, step_specs=steps)\n        wf.metadata["launch_config"] = {\n            "dataset_sources": list(dataset_sources or []),\n            "orca_link": orca_link,\n        }\n        self.cf_controller.client.put_workflow(wf)\n\n        # Launch Step 0\n'''
          replace_once('orca_orchestrator/service.py', old, new)

          old = '''    def get_workflow(self, creds: KaggleCredentials, workflow_id: str) -> dict[str, Any] | None:\n        BROKER.remember(creds)\n        wf = self.cf_controller.get_workflow(workflow_id, creds.username)\n        return wf.to_dict() if wf else None\n\n    def list_workflows(self, creds: KaggleCredentials) -> list[dict[str, Any]]:\n        BROKER.remember(creds)\n        wfs = self.cf_controller.list_user_workflows(creds.username)\n        return [w.to_dict() for w in wfs]\n'''
          new = '''    def get_workflow(self, creds: KaggleCredentials, workflow_id: str) -> dict[str, Any] | None:\n        BROKER.remember(creds)\n        try:\n            self.cf_controller.reconcile_user_session(creds, KaggleClient(creds))\n            self._drive_ready_workflows(creds, workflow_id=workflow_id)\n        except Exception as exc:\n            log.warning("Workflow reconciliation degraded for %s: %s", workflow_id, exc)\n        wf = self.cf_controller.get_workflow(workflow_id, creds.username)\n        return wf.to_dict() if wf else None\n\n    def list_workflows(self, creds: KaggleCredentials) -> list[dict[str, Any]]:\n        BROKER.remember(creds)\n        try:\n            self.cf_controller.reconcile_user_session(creds, KaggleClient(creds))\n            self._drive_ready_workflows(creds)\n        except Exception as exc:\n            log.warning("Workflow listing reconciliation degraded: %s", exc)\n        wfs = self.cf_controller.list_user_workflows(creds.username)\n        return [w.to_dict() for w in wfs]\n'''
          replace_once('orca_orchestrator/service.py', old, new)

          # Wire the background watchdog to the workflow driver. This lets a completed
          # predecessor advance after credentials are recovered from the encrypted vault,
          # even if the browser is closed.
          old = '''        self.store = store or get_store()\n        self.reconciler = Reconciler(self.store)\n        self.watchdog = Watchdog(self.store, self.reconciler, BROKER)\n        self.cf_controller = CloudflareController(store=self.store)\n        self.result_store = ResultArtifactStore()\n'''
          new = '''        self.store = store or get_store()\n        self.reconciler = Reconciler(self.store)\n        self.cf_controller = CloudflareController(store=self.store)\n        self.result_store = ResultArtifactStore()\n        self.watchdog = Watchdog(\n            self.store, self.reconciler, BROKER,\n            workflow_driver=self._reconcile_and_drive_workflows,\n        )\n'''
          replace_once('orca_orchestrator/service.py', old, new)

          # Watchdog callback support.
          old = '''    def __init__(self, store: JobStore, reconciler: Reconciler | None = None,\n                 broker: CredentialBroker | None = None, vault_manager: Any | None = None,\n                 *, config=CONFIG) -> None:\n        self.store = store\n        self.reconciler = reconciler or Reconciler(store, config=config)\n        self.broker = broker or BROKER\n        self.vault_manager = vault_manager\n        self.config = config\n'''
          new = '''    def __init__(self, store: JobStore, reconciler: Reconciler | None = None,\n                 broker: CredentialBroker | None = None, vault_manager: Any | None = None,\n                 *, config=CONFIG, workflow_driver=None) -> None:\n        self.store = store\n        self.reconciler = reconciler or Reconciler(store, config=config)\n        self.broker = broker or BROKER\n        self.vault_manager = vault_manager\n        self.workflow_driver = workflow_driver\n        self.config = config\n'''
          replace_once('orca_orchestrator/watchdog.py', old, new)

          old = '''                    self.reconciler.reconcile(job.job_id, creds, actor="watchdog")\n                    result.recovered += 1\n'''
          new = '''                    self.reconciler.reconcile(job.job_id, creds, actor="watchdog")\n                    if self.workflow_driver is not None:\n                        try:\n                            self.workflow_driver(creds)\n                        except Exception as exc:\n                            log.warning("Workflow driver failed after watchdog reconciliation: %s", exc)\n                    result.recovered += 1\n'''
          replace_once('orca_orchestrator/watchdog.py', old, new)

          # Required artefacts are enforced where output bytes are actually available.
          # Remove the silent no-op that made the controller look as though it validated them.
          old = '''        # Check required artifacts if specified\n        for req_art in step.required_artifacts:\n            if prereq_step.result_data and not prereq_step.result_data.get(req_art):\n                # If result_data specifically misses the required artifact\n                pass\n'''
          new = '''        # Required artefact *bytes* are validated by OrchestratorService immediately\n        # before launching the READY step, because Cloudflare stores metadata only and\n        # cannot truthfully assert what files are inside a Kaggle results archive here.\n'''
          replace_once('orca_orchestrator/cloudflare_controller/reconciliation.py', old, new)

          PY

      - name: Compile and run focused behavioural checks
        shell: bash
        run: |
          python -m py_compile \
            orca_orchestrator/api.py \
            orca_orchestrator/service.py \
            orca_orchestrator/watchdog.py \

name: ORCA workflow and listing hotfix

on:
  push:
    paths:
      - '.github/workflows/orca-workflow-listing-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded patches
        run: python .github/scripts/apply_orca_workflow_hotfix.py
      - name: Compile and run focused checks
        shell: bash
        run: |
          python -m py_compile orca_orchestrator/api.py orca_orchestrator/service.py orca_orchestrator/watchdog.py orca_orchestrator/cloudflare_controller/reconciliation.py
          python - <<'PY'
          from pathlib import Path
          api = Path('orca_orchestrator/api.py').read_text()
          svc = Path('orca_orchestrator/service.py').read_text()
          wd = Path('orca_orchestrator/watchdog.py').read_text()
          assert 'steps=payload.get("steps") or []' in api
          assert 'not_returned_by_kaggle_listing' in svc
          assert 'def _drive_ready_workflows' in svc
          assert 'workflow_step_{step.step_index}_geometry.xyz' in svc
          assert 'workflow_driver=self._reconcile_and_drive_workflows' in svc
          assert 'self.workflow_driver(creds)' in wd
          print('focused workflow/listing checks passed')
          PY
          pytest -q tests/test_cloudflare_controller.py --disable-warnings --maxfail=1
      - name: Commit verified fixes
        shell: bash
        run: |
          if git diff --quiet -- orca_orchestrator; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orca_orchestrator/api.py orca_orchestrator/service.py orca_orchestrator/watchdog.py orca_orchestrator/cloudflare_controller/reconciliation.py
          git commit -m 'fix: make My Jobs durable and advance ORCA workflows'
          git push

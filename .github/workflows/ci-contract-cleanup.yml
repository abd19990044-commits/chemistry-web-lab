name: CI contract cleanup

on:
  push:
    paths:
      - '.github/workflows/ci-contract-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply contract cleanup
        run: python .github/scripts/ci_contract_cleanup.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov jsonschema numpy
          python -m pip install -e ./orca_engine
      - name: Run formerly failing contract tests
        env:
          ORCA_CALLBACK_SECRET: contract-test-secret-0123456789abcdef012345
          ORCA_LOCAL_MODE: '1'
        shell: bash
        run: |
          set -o pipefail
          pytest -vv -s \
            tests/test_canonical_analyzer_refinement.py \
            tests/test_cloudflare_controller.py::TestServiceAndApiIntegration::test_service_submit_and_list_workflows \
            tests/test_cloudflare_recovery.py::TestCloudflareOutageResilience::test_service_operates_normally_when_cloudflare_is_unreachable \
            tests/test_kaggle_credential_vault.py::test_user_b_wakes_space_isolation \
            tests/test_frontend.py::test_suite \
            tests/test_web_routes.py::test_suite \
            2>&1 | tee ci-contract-diagnostics.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-contract-diagnostics
          path: ci-contract-diagnostics.txt
          if-no-files-found: ignore
      - name: Commit verified contract cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_canonical_analyzer_refinement.py \
            tests/test_cloudflare_controller.py \
            tests/test_cloudflare_recovery.py \
            tests/test_kaggle_credential_vault.py
          git commit -m 'test: align CI contracts with Kaggle-native orchestration'
          git push origin HEAD:main

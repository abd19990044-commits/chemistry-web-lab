name: One-time Kaggle credential format fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix credential export format
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/js/app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("downloadBtn.type = 'button'; downloadBtn.className = 'btn btn-ghost btn-small'; downloadBtn.textContent = '⬇ Save kaggle.json';", "downloadBtn.type = 'button'; downloadBtn.className = 'btn btn-ghost btn-small'; downloadBtn.textContent = '⬇ Save Kaggle credentials';")
          old="""      const blob = new Blob([JSON.stringify({username, key}, null, 2) + '\\n'], {type:'application/json'});\n      const url = URL.createObjectURL(blob); const a = document.createElement('a');\n      a.href = url; a.download = 'kaggle.json'; document.body.appendChild(a); a.click(); a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 1000);"""
          new="""      const isLegacy = /^[0-9a-f]{32}$/.test(key);\n      const payload = isLegacy ? JSON.stringify({username, key}, null, 2) + '\\n' : key + '\\n';\n      const blob = new Blob([payload], {type:'text/plain'});\n      const url = URL.createObjectURL(blob); const a = document.createElement('a');\n      a.href = url; a.download = isLegacy ? 'kaggle.json' : 'access_token'; document.body.appendChild(a); a.click(); a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 1000);"""
          if old not in s: raise SystemExit('download block not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/app.js
          git commit -m 'Handle Kaggle legacy keys and access tokens correctly in browser export'
          git push

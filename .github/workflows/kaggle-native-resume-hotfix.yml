name: Kaggle-native resume migration

on:
  push:
    paths:
      - '.github/workflows/kaggle-native-resume-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_kaggle_native_resume.py
      - name: Compile
        run: |
          python -m py_compile orca_orchestrator/api.py orca_orchestrator/service.py orca_orchestrator/runner/builder.py orca_orchestrator/runner/kernel_runner.py
          python - <<'PY'
          from pathlib import Path
          api=Path('orca_orchestrator/api.py').read_text()
          svc=Path('orca_orchestrator/service.py').read_text()
          bld=Path('orca_orchestrator/runner/builder.py').read_text()
          run=Path('orca_orchestrator/runner/kernel_runner.py').read_text()
          assert '/kernel-update' in api and '/wake' in api
          assert 'callback_base_url=request.url_root.rstrip("/")' in api
          assert 'def ingest_kernel_update' in svc
          assert 'state_source' in svc and 'KAGGLE_LEDGER' in svc
          assert 'callback_base_url' in bld and 'callback_token' in bld
          assert 'def wake_site' in run and 'def notify_site_from_state' in run
          assert 'X-ORCA-Callback-Token' in run
          print('focused Kaggle-native resume checks passed')
          PY
      - name: Commit verified migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orca_orchestrator/api.py orca_orchestrator/service.py orca_orchestrator/runner/builder.py orca_orchestrator/runner/kernel_runner.py
          git commit -m 'fix: make Kaggle the ORCA resume ledger and wake site callbacks'
          git push origin HEAD:main

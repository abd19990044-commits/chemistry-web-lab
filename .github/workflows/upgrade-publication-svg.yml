name: Add vector publication exports

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch renderer, API and UI
        shell: python
        run: |
          from pathlib import Path

          core = Path('chem_core.py')
          s = core.read_text(encoding='utf-8')
          marker = '\n\n# ---------------------------------------------------------------------------\n# Small molecules are written, not drawn\n'
          svg_code = '''


def render_molecule_svg(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE) -> bytes | None:
    """Return a true vector SVG molecular drawing for publication export."""
    mol = Chem.MolFromSmiles(smiles)
    if mol is None:
        return None
    try:
        AllChem.Compute2DCoords(mol)
        Chem.rdDepictor.StraightenDepiction(mol)
    except Exception:
        pass
    drawer = rdMolDraw2D.MolDraw2DSVG(size[0], size[1])
    _apply_common_draw_options(drawer)
    opts = drawer.drawOptions()
    try:
        opts.fixedBondLength = 90.0
        opts.fixedFontSize = 60.0
        opts.minFontSize = 48.0
        opts.maxFontSize = 66.0
        opts.padding = 0.05
    except Exception:
        pass
    try:
        drawer.SetFontSize(60)
    except Exception:
        pass
    rdMolDraw2D.PrepareAndDrawMolecule(drawer, mol, legend=legend)
    drawer.FinishDrawing()
    return drawer.GetDrawingText().encode("utf-8")


def render_reaction_svg(reactant_pairs, product_pairs) -> bytes | None:
    """Return a true vector RDKit reaction scheme as SVG."""
    try:
        def expand(pairs):
            out = []
            for coefficient, smiles in pairs:
                n = Fraction(coefficient)
                if n.denominator != 1 or n <= 0:
                    return None
                out.extend([smiles] * int(n))
            return out
        left = expand(reactant_pairs)
        right = expand(product_pairs)
        if not left or not right:
            return None
        rxn = rdChemReactions.ReactionFromSmarts(
            "%s>>%s" % (".".join(left), ".".join(right)), useSmiles=True
        )
        if rxn is None:
            return None
        rdChemReactions.Compute2DCoordsForReaction(rxn)
        drawer = rdMolDraw2D.MolDraw2DSVG(3600, 1800)
        _apply_common_draw_options(drawer)
        drawer.DrawReaction(rxn)
        drawer.FinishDrawing()
        return drawer.GetDrawingText().encode("utf-8")
    except Exception as exc:
        logger.warning("Vector reaction drawing failed: %s", exc)
        return None
'''
          if 'def render_molecule_svg(' not in s:
              if marker not in s:
                  raise SystemExit('chem_core marker not found')
              s = s.replace(marker, svg_code + marker, 1)
          s = s.replace('The output canvas is 1800x1350 px', 'The output canvas is 3600x2700 px', 1)
          core.write_text(s, encoding='utf-8')

          app = Path('app.py')
          s = app.read_text(encoding='utf-8')
          old = '"image_png_base64": b64(image_bytes),\n            "mol_file_base64": b64(mol_bytes),'
          new = '"image_png_base64": b64(image_bytes),\n            "image_svg_base64": b64(core.render_molecule_svg(smiles)),\n            "mol_file_base64": b64(mol_bytes),'
          if old not in s:
              raise SystemExit('compound payload marker not found')
          s = s.replace(old, new, 1)
          old = 'rxn_report = core.validate_rxn_block(rxn_bytes.decode("utf-8", errors="replace"))\n\n        notes = list(interpretations)'
          new = 'rxn_report = core.validate_rxn_block(rxn_bytes.decode("utf-8", errors="replace"))\n        svg_bytes = core.render_reaction_svg(as_pairs(rxn_reactants), as_pairs(rxn_products))\n\n        notes = list(interpretations)'
          if old not in s:
              raise SystemExit('reaction insertion marker not found')
          s = s.replace(old, new, 1)
          old = '"image_png_base64": b64(image_bytes),\n            "rxn_file_base64": b64(rxn_bytes),'
          new = '"image_png_base64": b64(image_bytes),\n            "image_svg_base64": b64(svg_bytes),\n            "rxn_file_base64": b64(rxn_bytes),'
          if old not in s:
              raise SystemExit('reaction payload marker not found')
          s = s.replace(old, new, 1)
          app.write_text(s, encoding='utf-8')

          js = Path('static/js/app.js')
          s = js.read_text(encoding='utf-8')
          helper = '''
  function ensureDownloadButton(parent, id, label, b64, mime, filename) {
    let el = document.getElementById(id);
    if (!el) {
      el = document.createElement("a");
      el.id = id;
      el.className = "btn btn-ghost btn-small";
      el.textContent = label;
      el.download = filename;
      parent.appendChild(el);
    }
    if (b64) setDownload(el, b64, mime, filename);
    el.classList.toggle("hidden", !b64);
  }
'''
          if 'function ensureDownloadButton(' not in s:
              needle = '  function setDownload(anchorEl, b64, mime, filename) {\n    anchorEl.href = b64ToDataUrl(b64, mime);\n    anchorEl.download = filename;\n  }\n'
              if needle not in s:
                  raise SystemExit('JS helper marker not found')
              s = s.replace(needle, needle + helper, 1)
          old = 'setDownload(document.getElementById("explorer-download-mol"), data.mol_file_base64, "chemical/x-mdl-molfile", `${data.filename}.mol`);'
          new = old + '\n      ensureDownloadButton(document.querySelector("#explorer-result .result-visual"), "explorer-download-svg", "⬇ Download SVG (vector)", data.image_svg_base64, "image/svg+xml", `${data.filename}.svg`);'
          if old not in s:
              raise SystemExit('molecule JS marker not found')
          s = s.replace(old, new, 1)
          old = 'setDownload(document.getElementById("reaction-download-rxn"), data.rxn_file_base64, "chemical/x-mdl-rxnfile", "reaction.rxn");'
          new = old + '\n      ensureDownloadButton(document.querySelector("#reaction-result .reaction-actions"), "reaction-download-svg", "⬇ Download SVG (vector)", data.image_svg_base64, "image/svg+xml", "reaction.svg");'
          if old not in s:
              raise SystemExit('reaction JS marker not found')
          s = s.replace(old, new, 1)
          js.write_text(s, encoding='utf-8')

      - name: Validate changes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile chem_core.py app.py
          grep -q 'render_molecule_svg' chem_core.py
          grep -q 'image_svg_base64' app.py
          grep -q 'ensureDownloadButton' static/js/app.js

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chem_core.py app.py static/js/app.js
          git commit -m 'feat: add vector SVG publication exports'
          git push

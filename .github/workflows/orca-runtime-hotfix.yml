name: ORCA runtime hotfix

on:
  push:
    paths:
      - '.github/workflows/orca-runtime-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused runtime fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('orca_orchestrator/runner/kernel_runner.py')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) Redact Hugging Face tokens in addition to Kaggle tokens.
          old = '_SECRET_RE = re.compile(r"(KGAT_[A-Za-z0-9_\\-]{6,}|\\b[0-9a-f]{32}\\b)")'
          new = '_SECRET_RE = re.compile(r"(KGAT_[A-Za-z0-9_\\-]{6,}|hf_[A-Za-z0-9]{20,}|\\b[0-9a-f]{32}\\b)")'
          assert old in s, 'secret scrubber anchor changed'
          s = s.replace(old, new, 1)

          # 2) Replace unvalidated MPI selection and /proc-only RAM detection.
          start = s.index('def find_mpirun(orca_dir):')
          end = s.index('\n\n# ---------------------------------------------------------------------------\n# 3. Execution', start)
          replacement = r'''def _openmpi_version(exe):
              try:
                  res = subprocess.run([exe, "--version"], capture_output=True, text=True, timeout=15)
                  text = (res.stdout or "") + "\n" + (res.stderr or "")
              except Exception:
                  return None
              m = re.search(r"(?:Open MPI|OpenRTE|PRRTE)[^0-9]*(\d+)\.(\d+)(?:\.(\d+))?", text, re.I)
              if not m:
                  return None
              return tuple(int(x or 0) for x in m.groups())


          def _expected_openmpi(orca_dir):
              """Infer the OpenMPI ABI family encoded in common ORCA package names."""
              probe = os.path.realpath(orca_dir).lower()
              m = re.search(r"openmpi(\d)(\d)(\d)", probe)
              if m:
                  return tuple(int(x) for x in m.groups())
              m = re.search(r"openmpi[_-]?(\d+)\.(\d+)(?:\.(\d+))?", probe)
              if m:
                  return tuple(int(x or 0) for x in m.groups())
              return None


          def _mpi_compatible(version, expected):
              if version is None:
                  return False
              if expected is None:
                  # ORCA 6.x Linux shared builds are normally distributed for OpenMPI 4.1.x.
                  # Unknown builds are therefore accepted only for that ABI family; otherwise
                  # falling back to serial is safer than launching with an incompatible MPI.
                  return version[:2] == (4, 1)
              return version[:2] == expected[:2]


          def find_mpirun(orca_dir):
              expected = _expected_openmpi(orca_dir)
              candidates = []
              for name in ("mpirun", "orterun", "prterun"):
                  found = shutil.which(name)
                  if found:
                      candidates.append(found)
              for pattern in ("mpirun", os.path.join("*", "mpirun"), os.path.join("*", "bin", "mpirun")):
                  candidates.extend(glob.glob(os.path.join(orca_dir, pattern)))
                  candidates.extend(glob.glob(os.path.join(os.path.dirname(orca_dir), pattern)))

              seen = set()
              for candidate in candidates:
                  candidate = os.path.realpath(candidate)
                  if candidate in seen or not os.path.isfile(candidate):
                      continue
                  seen.add(candidate)
                  version = _openmpi_version(candidate)
                  if not _mpi_compatible(version, expected):
                      emit("mpi_rejected", "ignoring an incompatible MPI launcher",
                           launcher=candidate, detected_version=version, expected_version=expected)
                      continue
                  os.environ["PATH"] = os.path.dirname(candidate) + os.pathsep + os.environ.get("PATH", "")
                  try:
                      os.chmod(candidate, 0o755)
                  except OSError:
                      pass
                  emit("mpi_selected", "selected a compatible OpenMPI launcher",
                       launcher=candidate, detected_version=version, expected_version=expected)
                  return candidate

              # A distro package may help only if it lands on the required ABI family.
              for cmd in (["apt-get", "-y", "-qq", "update"],
                          ["apt-get", "-y", "-qq", "install", "openmpi-bin", "libopenmpi3"]):
                  try:
                      subprocess.run(cmd, capture_output=True, text=True, timeout=300)
                  except Exception:
                      return None
              candidate = shutil.which("mpirun")
              if candidate and _mpi_compatible(_openmpi_version(candidate), expected):
                  return candidate
              return None


          def _cgroup_memory_limit_mb():
              candidates = (
                  "/sys/fs/cgroup/memory.max",
                  "/sys/fs/cgroup/memory/memory.limit_in_bytes",
              )
              limits = []
              for path in candidates:
                  try:
                      with open(path) as fh:
                          raw = fh.read().strip()
                      if not raw or raw == "max":
                          continue
                      value = int(raw)
                      # Ignore sentinel/unlimited values commonly used by cgroup v1.
                      if 0 < value < (1 << 60):
                          limits.append(value // (1 << 20))
                  except (OSError, ValueError):
                      pass
              return min(limits) if limits else None


          def total_ram_mb():
              proc_total = None
              try:
                  with open("/proc/meminfo") as fh:
                      for line in fh:
                          if line.startswith("MemTotal:"):
                              proc_total = int(line.split()[1]) // 1024
                              break
              except OSError:
                  pass
              cgroup_total = _cgroup_memory_limit_mb()
              candidates = [x for x in (proc_total, cgroup_total) if x and x > 0]
              effective = min(candidates) if candidates else 12000
              emit("memory_detected", "effective memory limit established",
                   proc_memtotal_mb=proc_total, cgroup_limit_mb=cgroup_total, effective_mb=effective)
              return effective
          '''
          # Dedent the source block produced by the workflow's Python indentation.
          import textwrap
          replacement = textwrap.dedent(replacement)
          s = s[:start] + replacement + s[end:]

          # 3) Distinguish restartable NumFreq from analytical Freq.
          anchor = '''# ---------------------------------------------------------------------------\n# 4. Continuation input\n# ---------------------------------------------------------------------------\ndef build_continuation'''
          helper = '''# ---------------------------------------------------------------------------\n# 4. Continuation input\n# ---------------------------------------------------------------------------\ndef is_numerical_frequency(input_text):\n    """True only for ORCA NumFreq; analytical Freq is not partially restartable."""\n    return bool(re.search(r"(?i)(?<![a-z])numfreq(?![a-z])", input_text or ""))\n\n\ndef build_continuation'''
          assert anchor in s, 'continuation anchor changed'
          s = s.replace(anchor, helper, 1)

          old = '''    charge, mult = art.extract_charge_mult(original_text)\n    text = art.strip_moread(original_text)\n    carried, notes = [], []\n'''
          new = '''    charge, mult = art.extract_charge_mult(original_text)\n    text = art.strip_moread(original_text)\n    numerical_freq = is_numerical_frequency(original_text)\n    carried, notes = [], []\n'''
          assert old in s, 'continuation preamble changed'
          s = s.replace(old, new, 1)

          old = '''    elif job_kind == "freq" or (job_kind == "opt_freq" and outcome.opt_converged):\n        block = re.search(r"(?is)%\\s*freq\\b.*?\\bend\\b", text)\n        if block and "restart" not in block.group(0).lower():\n            text = re.sub(r"(?i)(%\\s*freq\\b)", lambda m: m.group(0) + "\\n  Restart true",\n                          text, count=1)\n        elif not block and re.search(r"(?i)\\bnumfreq\\b", text):\n            text = re.sub(r"(?i)(![^\\n]*\\bnumfreq\\b[^\\n]*)",\n                          lambda m: m.group(0) + "\\n%freq Restart true end", text, count=1)\n        for path in sorted(glob.glob(wp(BASENAME + ".res.*"))):\n            carry(path, 15)\n        if outcome.opt_converged and os.path.exists(wp(BASENAME + ".xyz")):\n            # The optimisation is done; drop it and continue with frequencies\n            # only, so the successor does not redo a converged geometry.\n            text = re.sub(r"(?i)\\bopt(ts)?\\b", "", text, count=1)\n            text = art.set_geometry(text, BASENAME + ".xyz", charge, mult)\n            carry(wp(BASENAME + ".xyz"), 10)\n            notes.append("optimisation converged; continuing with frequencies only")\n        else:\n            notes.append("frequency calculation resumed from its partial Hessian columns")\n'''
          new = '''    elif job_kind == "freq" or (job_kind == "opt_freq" and outcome.opt_converged):\n        if numerical_freq:\n            block = re.search(r"(?is)%\\s*freq\\b.*?\\bend\\b", text)\n            if block and "restart" not in block.group(0).lower():\n                text = re.sub(r"(?i)(%\\s*freq\\b)", lambda m: m.group(0) + "\\n  Restart true",\n                              text, count=1)\n            elif not block and re.search(r"(?i)\\bnumfreq\\b", text):\n                text = re.sub(r"(?i)(![^\\n]*\\bnumfreq\\b[^\\n]*)",\n                              lambda m: m.group(0) + "\\n%freq Restart true end", text, count=1)\n            for path in sorted(glob.glob(wp(BASENAME + ".res.*"))):\n                carry(path, 15)\n        if outcome.opt_converged and os.path.exists(wp(BASENAME + ".xyz")):\n            # The optimisation is done; drop it and continue with frequencies\n            # only, so the successor does not redo a converged geometry.\n            text = re.sub(r"(?i)\\bopt(ts)?\\b", "", text, count=1)\n            text = art.set_geometry(text, BASENAME + ".xyz", charge, mult)\n            carry(wp(BASENAME + ".xyz"), 10)\n            if numerical_freq:\n                notes.append("optimisation converged; continuing resumable numerical frequencies only")\n            else:\n                notes.append("optimisation converged; analytical frequencies restart from the beginning")\n        elif numerical_freq:\n            notes.append("numerical frequency calculation resumed from .res.* files")\n        else:\n            notes.append("analytical frequency calculations are not partially restartable")\n'''
          assert old in s, 'frequency continuation block changed'
          s = s.replace(old, new, 1)

          # 4) Correct stale/legacy job-kind fallback.
          old = '    job_kind = H.get("job_kind") or art.detect_job_kind(original_text)\n'
          new = '    job_kind = H.get("job_kind")\n    if not job_kind or job_kind == "unknown":\n        job_kind = art.detect_job_kind(original_text)\n'
          assert old in s, 'job_kind anchor changed'
          s = s.replace(old, new, 1)

          # 5) Use a 75% memory budget and cgroup-aware effective RAM.
          s = s.replace('art.clamp_maxcore(text, nprocs, total_ram_mb())',
                        'art.clamp_maxcore(text, nprocs, total_ram_mb(), fraction=0.75)', 1)
          s = s.replace('art.clamp_maxcore(art.set_nprocs(text, 1), 1, total_ram_mb())',
                        'art.clamp_maxcore(art.set_nprocs(text, 1), 1, total_ram_mb(), fraction=0.75)', 1)

          # 6) Accumulate every in-session pass instead of resetting to header baseline.
          old = '        cumulative = int(H.get("cumulative_opt_cycles") or 0) + outcome.opt_cycles\n'
          assert old in s, 'cumulative-cycle anchor changed'
          s = s.replace(old, '        cumulative += outcome.opt_cycles\n', 1)

          # 7) Do not chain a pure analytical Freq job forever after an interrupted run.
          needle = '    if not art.is_iterative(job_kind) and outcome.kind != art.OUTCOME_DISK:\n'
          replacement = '''    if (job_kind == "freq" and not is_numerical_frequency(original_text)\n            and outcome.kind != art.OUTCOME_DISK):\n        note = ("Analytical ORCA frequency calculations cannot be resumed from partial "\n                "Hessian columns. This window did not finish, so automatically chaining "\n                "another window would restart the same frequency calculation from zero. "\n                "Use NumFreq for restartable frequencies or provide a window large enough "\n                "for analytical Freq to finish.")\n        write_state("FAILED", note=note, job_kind=job_kind,\n                    error={"code": "analytical_freq_not_resumable"},\n                    cumulative_cycles=cumulative, disk_epochs=disk_epochs, outcome=outcome)\n        purge_scratch()\n        package_results(note=note)\n        return 1\n\n    if not art.is_iterative(job_kind) and outcome.kind != art.OUTCOME_DISK:\n'''
          assert needle in s, 'non-resumable anchor changed'
          s = s.replace(needle, replacement, 1)

          assert s != original
          p.write_text(s, encoding='utf-8')
          PY

          python -m py_compile orca_orchestrator/runner/kernel_runner.py

          python - <<'PY'
          from pathlib import Path
          s = Path('orca_orchestrator/runner/kernel_runner.py').read_text()
          assert 'hf_[A-Za-z0-9]{20,}' in s
          assert 'cumulative += outcome.opt_cycles' in s
          assert 'fraction=0.75' in s
          assert 'memory.max' in s
          assert 'def _mpi_compatible' in s
          assert 'def is_numerical_frequency' in s
          assert 'analytical_freq_not_resumable' in s
          print('ORCA runtime hotfix verification passed')
          PY
      - name: Commit patched runtime
        shell: bash
        run: |
          if git diff --quiet -- orca_orchestrator/runner/kernel_runner.py; then
            echo 'No runtime changes to commit'
            exit 0
          fi
          git config user.name 'ORCA Runtime Hotfix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add orca_orchestrator/runner/kernel_runner.py
          git commit -m 'fix: harden ORCA Kaggle runtime and restart semantics'
          git push

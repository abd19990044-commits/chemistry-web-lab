name: Deploy Hugging Face runtime
# Includes the Spaces iframe and partitioned-session compatibility fix.
# Refreshes Kaggle cancellation, remote activity counts, and Cloudflare job versions.
# Preserves archived Cloudflare history during Kaggle status outages.
# Ships Molecular Studio pointer controls, rigid transforms, and camera tools.
# Adds an interactive canvas renderer for browsers without WebGL.
# Keeps only .out members when importing archives in analysis and thermochemistry.
# Adds high-resolution PNG export to the input geometry editor.
# Publishes sized scientific PNG/TIFF/SVG figures with explicit print resolution.
# Labels oscillator-strength-weighted UV-Vis intensity without uncalibrated epsilon units.

# Renders molecular figures with depth-correct multiple bonds and configurable print labels.
# Keeps print label placement consistent and supports manual label positioning in preview.
# Reduces PubChem/Kaggle latency and retries staged geometry handoffs without duplicate launches.
# Serves precompressed native browser-engine assets to accelerate cold imports.
# Transfers ChemDraw tools, standalone browser 2D editing, and distinct MOL/SDF/XYZ exports.
# Preserves full RXN chemistry with editable KET captions and expands without fullscreen permission.
# Defaults PNG and Word to maximum device-adaptive resolution, up to 12000 pixels and 64 MP.
on:
  workflow_dispatch:
  # Bootstrap this deployment when the workflow is added to main. Later
  # application changes are deployed explicitly with "Run workflow".
  push:
    branches: [main]
    paths: [.github/workflows/deploy-huggingface.yml]

permissions:
  contents: read

concurrency:
  group: deploy-huggingface-orcaweb
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: HF_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify minimal runtime package
        run: |
          python tools/build_deployment_packages.py --mode release --target huggingface
          python -m compileall -q HuggingFace
          # Bytecode is not part of the verified deployment package.
          find HuggingFace -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Install upload client
        run: python -m pip install huggingface_hub==2.2.0
      - name: Publish verified runtime to the existing Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "").strip()
          if not token:
              raise SystemExit("Missing repository Actions secret HF_TOKEN.")
          folder = Path("HuggingFace")
          manifest = json.loads((folder / "RELEASE_MANIFEST.json").read_text())
          if manifest["source_git_sha"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("Package source does not match the checked-out commit.")
          expected = manifest["runtime_critical_files"]
          actual = {p.relative_to(folder).as_posix() for p in folder.rglob("*") if p.is_file()}
          if actual != set(expected) | {"RELEASE_MANIFEST.json"}:
              raise SystemExit("Package inventory changed after verification.")
          for relative, metadata in expected.items():
              if hashlib.sha256((folder / relative).read_bytes()).hexdigest() != metadata["sha256"]:
                  raise SystemExit(f"Package checksum mismatch: {relative}")

          repo_id = "mc2hf1999/orcaweb"
          api = HfApi(token=token)
          space = api.space_info(repo_id)
          if space.sdk != "docker":
              raise SystemExit("The existing Space must use the Docker SDK.")
          commit = api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=folder,
              delete_patterns="*",
              parent_commit=space.sha,
              commit_message=f"Deploy minimal runtime from GitHub {os.environ['GITHUB_SHA'][:12]}",
          )
          print(f"Published {len(actual)} runtime files: {commit.commit_url}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Deployed **{len(actual)} runtime files** to https://huggingface.co/spaces/{repo_id}\n\n")
              summary.write(f"Source: `{os.environ['GITHUB_SHA']}`\n\nSpace commit: {commit.commit_url}\n")
          PY

# Runtime update: stable chemical graphs and browser-side Open Babel UFF.

# Runtime update: calculated-geometry viewer, browser fallback, inspection and PNG.

# Refresh worker dependencies together and keep geometry-only views free of inferred QM labels.

# Runtime source alignment: normalize missing-value placeholder punctuation.

# Runtime update: export rendered molecular PNGs as downloadable binary blobs.

# Runtime source alignment: export explicit MDL 3D metadata and preserve reimported geometry.

name: Fix Kaggle login flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-kaggle-login.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch login architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          # -------------------------
          # kaggle_runner.py
          # -------------------------
          p = Path('kaggle_runner.py')
          s = p.read_text(encoding='utf-8')
          if 'def verify_kaggle_credentials(' not in s:
              marker = '\ndef list_jobs(kaggle_username: str, kaggle_key: str) -> list[dict]:\n'
              if marker not in s:
                  raise SystemExit('list_jobs insertion marker not found')
              fn = '''\n\ndef verify_kaggle_credentials(kaggle_username: str, kaggle_key: str) -> dict:\n    """Fast authentication check. It deliberately does not enumerate jobs."""\n    auth = resolve_kaggle_auth(kaggle_username, kaggle_key)\n    with _temp_kaggle_env(kaggle_username, kaggle_key) as env:\n        result = _run_kaggle_cli(\n            ["kaggle", "kernels", "list", "--mine", "--csv", "--page-size", "1", "--page", "1"],\n            env=env, timeout=30, attempts=2, base_delay=1.0,\n        )\n        combined = (result.stdout or "") + "\\n" + (result.stderr or "")\n        if result.returncode != 0:\n            _raise_if_cli_broken(combined)\n            _raise_if_unreachable(combined)\n            low = combined.lower()\n            if "401" in combined or "unauthorized" in low or "authentication required" in low or "forbidden" in low:\n                raise RuntimeError("Kaggle rejected these credentials. Check the username and API key/token.")\n            raise RuntimeError((result.stderr or result.stdout or "Kaggle credential verification failed.").strip())\n    return {"username": auth["username"]}\n'''
              s = s.replace(marker, fn + marker, 1)
              p.write_text(s, encoding='utf-8')

          # -------------------------
          # app.py
          # -------------------------
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          start = s.find('@app.route("/api/kaggle/login", methods=["POST"])')
          end = s.find('@app.route("/api/kaggle/submit", methods=["POST"])', start)
          if start < 0 or end < 0:
              raise SystemExit('Kaggle login route boundaries not found')
          route = '''@app.route("/api/kaggle/login", methods=["POST"])\ndef api_kaggle_login():\n    """Fast credential verification only; job recovery is asynchronous."""\n    data = request.get_json(force=True, silent=True) or {}\n    kaggle_username = (data.get("kaggle_username") or "").strip()\n    kaggle_key = (data.get("kaggle_key") or "").strip()\n    kaggle_username, kaggle_key = kaggle_runner.clean_kaggle_credentials(kaggle_username, kaggle_key)\n    if not kaggle_username or not kaggle_key:\n        return error_response("Please enter your Kaggle username and API key/token.")\n    try:\n        auth = kaggle_runner.verify_kaggle_credentials(kaggle_username, kaggle_key)\n        log.info("kaggle credentials verified", extra={"event": "signed_in"})\n        return jsonify({"ok": True, "username": auth["username"]})\n    except (kaggle_runner.KaggleCliUnavailable, kaggle_runner.KaggleUnreachable) as exc:\n        log.error("kaggle credential verification unavailable:\\n%s", traceback.format_exc())\n        return error_response(str(exc), 503)\n    except Exception as exc:\n        log.error("api_kaggle_login failed:\\n%s", traceback.format_exc())\n        message = str(exc).strip() or "Kaggle credential verification failed."\n        return error_response(f"Could not sign in to Kaggle: {message}", 401)\n\n\n@app.route("/api/kaggle/sync", methods=["POST"])\ndef api_kaggle_sync():\n    """Rebuild the Chemistry Lab job list from Kaggle independently of login."""\n    data = request.get_json(force=True, silent=True) or {}\n    kaggle_username = (data.get("kaggle_username") or "").strip()\n    kaggle_key = (data.get("kaggle_key") or "").strip()\n    kaggle_username, kaggle_key = kaggle_runner.clean_kaggle_credentials(kaggle_username, kaggle_key)\n    if not kaggle_username or not kaggle_key:\n        return error_response("Missing Kaggle username or API key/token.")\n    try:\n        jobs = kaggle_runner.list_jobs(kaggle_username, kaggle_key)\n        return jsonify({"ok": True, "jobs": jobs})\n    except (kaggle_runner.KaggleCliUnavailable, kaggle_runner.KaggleUnreachable) as exc:\n        log.error("kaggle sync unavailable:\\n%s", traceback.format_exc())\n        return error_response(str(exc), 503)\n    except Exception as exc:\n        log.error("api_kaggle_sync failed:\\n%s", traceback.format_exc())\n        return error_response(f"Could not synchronize Kaggle jobs: {exc}", 502)\n\n\n'''
          s = s[:start] + route + s[end:]
          p.write_text(s, encoding='utf-8')

          # -------------------------
          # static/js/app.js
          # -------------------------
          p = Path('static/js/app.js')
          s = p.read_text(encoding='utf-8')
          old = '''  async function postJSON(url, body) {\n    const resp = await fetch(url, {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify(body),\n    });\n    const data = await resp.json().catch(() => ({ ok: false, error: "Invalid response from server." }));\n    if (!resp.ok || !data.ok) throw new Error(data.error || "An unexpected error occurred.");\n    return data;\n  }'''
          new = '''  async function postJSON(url, body) {\n    const resp = await fetch(url, {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify(body),\n    });\n    const contentType = resp.headers.get("content-type") || "";\n    let data = null;\n    if (contentType.includes("application/json")) {\n      data = await resp.json().catch(() => null);\n    } else {\n      const text = await resp.text().catch(() => "");\n      const detail = text.replace(/<[^>]+>/g, " ").replace(/\\s+/g, " ").trim().slice(0, 240);\n      throw new Error(`Server returned HTTP ${resp.status}${detail ? `: ${detail}` : "."}`);\n    }\n    if (!data) throw new Error(`Server returned HTTP ${resp.status} with an invalid JSON response.`);\n    if (!resp.ok || !data.ok) throw new Error(data.error || `Request failed (HTTP ${resp.status}).`);\n    return data;\n  }'''
          if old not in s:
              raise SystemExit('postJSON implementation not found')
          s = s.replace(old, new, 1)

          a = s.find('  async function attemptLogin(username, key, opts) {')
          b = s.find('\\n  // If credentials were remembered from a previous visit', a)
          if a < 0 or b < 0:
              raise SystemExit('attemptLogin boundaries not found')
          replacement = '''  async function syncKaggleJobs(username, key, opts = {}) {\n    const silent = !!opts.silent;\n    try {\n      const data = await postJSON("/api/kaggle/sync", { kaggle_username: username, kaggle_key: key });\n      mergeRemoteJobs(username, key, data.jobs || []);\n      pollAllActiveJobs();\n      return true;\n    } catch (err) {\n      if (!silent) showToast(`<strong>Kaggle job sync failed</strong><br>${err.message}`);\n      else console.warn("Kaggle job sync failed:", err.message);\n      return false;\n    }\n  }\n\n  async function attemptLogin(username, key, opts) {\n    const silent = opts && opts.silent;\n    if (!silent) { hide(kaggleLoginError); show(kaggleLoginLoading); }\n    try {\n      const data = await postJSON("/api/kaggle/login", { kaggle_username: username, kaggle_key: key });\n      const verifiedUsername = data.username || username;\n      setSignedIn(verifiedUsername, key);\n      sessionKaggleKey = key;\n      syncKaggleJobs(verifiedUsername, key, { silent: true });\n      return true;\n    } catch (err) {\n      if (!silent) showError(kaggleLoginError, err.message);\n      return false;\n    } finally {\n      if (!silent) hide(kaggleLoginLoading);\n    }\n  }'''
          s = s[:a] + replacement + s[b:]
          p.write_text(s, encoding='utf-8')

          print('Patched Kaggle login architecture successfully.')
          PY

      - name: Validate Python and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py kaggle_runner.py
          node --check static/js/app.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py kaggle_runner.py static/js/app.js
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'fix: separate Kaggle login from job synchronization [skip ci]'
            git push
          fi

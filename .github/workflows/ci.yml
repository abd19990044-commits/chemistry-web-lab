name: CI

# Single authoritative workflow (merged from the deployed variant and the
# source tree; see FULL_PROJECT_REPAIR_PLAN.md P1-4).
#
# Gating policy:
#   * ruff findings are tracked as a documented, NON-blocking baseline
#     (legacy lint debt; must not be allowed to hide correctness failures).
#     Blocking correctness is enforced by the compileall syntax gate and the
#     full test matrix instead.
#   * The security scan is ALWAYS blocking. Known-synthetic credential
#     fixtures under tests/ are exempt from the KGAT_ token pattern only -
#     every other pattern (legacy 32-hex keys, Cloudflare tokens, personal
#     machine paths) applies to the whole tree, tests included.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-static-check:
    name: Lint & Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff jsonschema

      # Documented baseline (667 legacy findings as of v1.0.3). Informational
      # by explicit decision - the blocking correctness gate for source code
      # is the compileall step below plus the full test matrix.
      - name: Run Ruff Baseline Audit
        continue-on-error: true
        run: |
          ruff check . --config pyproject.toml --output-format=github

      - name: Run Blocking Python Syntax Check
        run: |
          python -m compileall -q \
            app.py \
            chem_core.py \
            kaggle_runner.py \
            reaction_conditions.py \
            sitecustomize.py \
            usercustomize.py \
            api \
            services \
            local_agent \
            chem_core \
            orca_orchestrator \
            orca_engine/src \
            tools

      - name: Validate Canonical Scientific Schemas
        run: |
          python -c "
          import json, jsonschema
          with open('schema/canonical_scientific.schema.json', 'r', encoding='utf-8') as f:
              schema = json.load(f)
          jsonschema.Draft202012Validator.check_schema(schema)
          print('Schema Draft 2020-12 check passed successfully')
          "

  test-matrix:
    name: Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [lint-and-static-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov jsonschema numpy
          python -m pip install ./orca_engine

      - name: Run Pytest Test Suite
        run: |
          pytest -v

  security-and-secret-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Secret & Hardcoded Path Scanner
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          secret_patterns = [
              re.compile(r"KGAT_[A-Za-z0-9_-]{20,}"),
              re.compile(r'"kaggle_key"\s*:\s*"[a-f0-9]{32}"'),
              re.compile(r"CF_API_TOKEN\s*=\s*['\"][A-Za-z0-9_-]{20,}"),
          ]
          path_patterns = [
              re.compile(r"[gG]:[\\/]orca web lab", re.IGNORECASE),
              re.compile(r"C:[\\/]Users[\\/][a-zA-Z0-9_-]+", re.IGNORECASE),
          ]

          # Synthetic credential fixtures under tests/ are exempt from the
          # KGAT_ pattern ONLY (they are deliberately fake strings declared
          # in tests/test_kaggle_credential_vault.py). Every other secret
          # pattern and both personal-path patterns still apply everywhere.
          kgat_test_exemption = re.compile(r"^tests[\\/]")
          # Third-party-generated ORCA outputs kept as parser fixtures quote
          # the original machine paths inside the calculation log itself;
          # they are scientific data, not configuration. Path patterns are
          # disabled for the corpus only - secret patterns still apply.
          fixture_corpus = re.compile(r"^orca_engine/data/")
          ignored = {'.git', '__pycache__', '.pytest_cache', 'node_modules', '.venv', 'venv', 'temp_pytest_run'}
          violations = []

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ignored]
              for filename in files:
                  if filename.endswith(('.pyc', '.png', '.jpg', '.jpeg', '.tar', '.gz', '.zip', '.rar', '.out', '.db')):
                      continue
                  path = os.path.join(root, filename)
                  rel = path.replace('\\', '/').lstrip('./')
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as handle:
                          for line_no, line in enumerate(handle, 1):
                              for pattern in secret_patterns:
                                  if pattern.search(line):
                                      if pattern.pattern.startswith("KGAT_") and kgat_test_exemption.match(rel):
                                          continue
                                      violations.append(f"{path}:{line_no} -> {line.strip()[:120]}")
                              for pattern in path_patterns:
                                  if pattern.search(line):
                                      if fixture_corpus.match(rel):
                                          continue
                                      violations.append(f"{path}:{line_no} -> {line.strip()[:120]}")
                  except (OSError, UnicodeError):
                      continue

          if violations:
              print(f"Found {len(violations)} secret/path violations:")
              for violation in violations:
                  print(f"  {violation}")
              sys.exit(1)

          print("Security and secret audit passed with 0 violations.")
          PY

  clean-install-verification:
    name: Clean Wheel Distributable & Readiness Verification
    needs: [lint-and-static-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Distributable Wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install Wheel in Isolated Environment & Verify Readiness
        run: |
          python -m venv /tmp/test_clean_venv
          source /tmp/test_clean_venv/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest httpx
          python -c "import api.main, orca_engine, services.reaction_diagram_service; print('Imported api.main, orca_engine, and services.reaction_diagram_service successfully from built wheel!')"
          python -c "
          from fastapi.testclient import TestClient
          from api.main import app
          client = TestClient(app)
          resp = client.get('/api/v1/ready')
          assert resp.status_code == 200, f'Expected 200, got {resp.status_code}: {resp.text}'
          data = resp.json()
          assert data.get('ready') is True, f'Expected ready True, got {data}'
          print('FastAPI /api/v1/ready probe verified 200 OK with ready: true')

          resp_ui = client.get('/')
          assert resp_ui.status_code == 200, f'Expected 200, got {resp_ui.status_code}'
          assert 'Chemistry Lab' in resp_ui.text, 'Expected Chemistry Lab in HTML'
          print('Flask legacy UI mount verified 200 OK')

          resp_js = client.get('/static/js/app.js')
          assert resp_js.status_code == 200, f'Expected 200, got {resp_js.status_code}'
          assert len(resp_js.text) > 100, 'Expected static JS content'
          print('Static asset /static/js/app.js verified 200 OK')

          resp_rxn_js = client.get('/static/js/reaction-unified.js')
          assert resp_rxn_js.status_code == 200, f'Expected 200, got {resp_rxn_js.status_code}'
          assert len(resp_rxn_js.text) > 100, 'Expected reaction-unified JS content'
          print('Static asset /static/js/reaction-unified.js verified 200 OK')
          "

  ci-gate:
    name: Release Gate
    needs: [lint-and-static-check, test-matrix, security-and-secret-audit, clean-install-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Release Gate Check
        run: |
          echo "All CI jobs passed. Release gate is GREEN."

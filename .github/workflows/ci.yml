name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply publication-quality molecule renderer
        if: github.actor != 'github-actions[bot]'
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('chem_core.py')
          s = p.read_text(encoding='utf-8')
          old = 'MOL_IMAGE_SIZE = (560, 420)\nREACTION_SUBIMAGE_SIZE = (420, 340)\nDRAWING_BOND_LINE_WIDTH = 2\nDRAWING_FONT_SCALE = 0.85'
          new = '''# Publication-quality PNG export: 2400x1800 px = 4x3 in at 600 dpi.
MOL_IMAGE_SIZE = (2400, 1800)
REACTION_SUBIMAGE_SIZE = (1680, 1360)
DRAWING_EXPORT_DPI = 600
DRAWING_REFERENCE_SIZE = (560, 420)
DRAWING_BOND_LINE_WIDTH = 2
DRAWING_FONT_SCALE = 0.85'''
          if old in s:
              s = s.replace(old, new, 1)

          pattern = re.compile(
              r'def render_molecule_png\(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE\) -> bytes \| None:\n'
              r'.*?\n\n\n# ---------------------------------------------------------------------------\n# Small molecules are written, not drawn',
              re.S,
          )
          replacement = '''def render_molecule_png(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE) -> bytes | None:
    """Render a publication-quality molecule PNG at 600 dpi."""
    from PIL import Image

    mol = Chem.MolFromSmiles(smiles)
    if mol is None:
        return None
    try:
        AllChem.Compute2DCoords(mol)
        Chem.rdDepictor.StraightenDepiction(mol)
    except Exception:
        pass

    drawer = rdMolDraw2D.MolDraw2DCairo(size[0], size[1])
    _apply_common_draw_options(drawer)
    opts = drawer.drawOptions()
    scale = min(size[0] / DRAWING_REFERENCE_SIZE[0], size[1] / DRAWING_REFERENCE_SIZE[1])
    try:
        opts.fixedBondLength = 30.0 * scale
        opts.fixedFontSize = 16.0 * scale
        opts.minFontSize = 12.0 * scale
        opts.maxFontSize = 18.0 * scale
        opts.bondLineWidth = DRAWING_BOND_LINE_WIDTH * scale
        opts.padding = 0.05
    except Exception:
        pass

    rdMolDraw2D.PrepareAndDrawMolecule(drawer, mol, legend=legend)
    drawer.FinishDrawing()
    raw = drawer.GetDrawingText()
    try:
        image = Image.open(io.BytesIO(raw)).convert("RGB")
        out = io.BytesIO()
        image.save(out, format="PNG", dpi=(DRAWING_EXPORT_DPI, DRAWING_EXPORT_DPI), optimize=True)
        return out.getvalue()
    except Exception as exc:
        logger.warning("Could not add PNG 600-dpi metadata: %s", exc)
        return raw


# ---------------------------------------------------------------------------
# Small molecules are written, not drawn'''
          ns, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('renderer block not found; refusing unsafe edit')
          p.write_text(ns, encoding='utf-8')

      - name: Validate 600 dpi renderer
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile chem_core.py
          python - <<'PY'
          import io
          from PIL import Image
          import chem_core
          raw = chem_core.render_molecule_png('COC1=CC=CC2=C1C=CC=C2C(C)C(=O)O')
          assert raw
          im = Image.open(io.BytesIO(raw))
          assert im.size == (2400, 1800), im.size
          dpi = im.info.get('dpi')
          assert dpi and dpi[0] >= 599 and dpi[1] >= 599, dpi
          print('600 dpi renderer OK:', im.size, dpi)
          PY

      - name: Persist renderer patch
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chem_core.py
          if git diff --cached --quiet; then
            echo 'Renderer already patched'
          else
            git commit -m 'feat: export chemical drawings at 600 dpi'
            git push
          fi

      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Import production application
        env:
          SECRET_KEY: ci-test-secret-key
          PYTHONPATH: .
        run: python -c "import chem_core; import orca_orchestrator; import app; print('production imports OK')"
      - name: Run production and drawing tests
        env:
          SECRET_KEY: ci-test-secret-key
          PYTHONPATH: .
        run: pytest -q tests/test_production_wiring.py tests/test_drawing.py

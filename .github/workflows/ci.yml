name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Import orchestrator
        run: python -c "import orca_orchestrator; print(orca_orchestrator.__version__)"
      - name: Run production and drawing tests
        env:
          SECRET_KEY: ci-test-secret-key
        run: pytest -q tests/test_production_wiring.py tests/test_drawing.py
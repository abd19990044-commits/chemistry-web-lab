name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Import production application
        env:
          SECRET_KEY: ci-test-secret-key
          PYTHONPATH: .
        run: python -c "import chem_core; import orca_orchestrator; import app; print('production imports OK')"
      - name: Run production and drawing tests
        env:
          SECRET_KEY: ci-test-secret-key
          PYTHONPATH: .
        run: pytest -q tests/test_production_wiring.py tests/test_drawing.py

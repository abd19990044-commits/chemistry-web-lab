name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply deterministic molecule renderer fix
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('chem_core.py')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'def render_molecule_png\(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE\) -> bytes \| None:\n'
              r'.*?\n\n\n# ---------------------------------------------------------------------------\n# Small molecules are written, not drawn',
              re.S,
          )
          replacement = '''def render_molecule_png(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE) -> bytes | None:
    """Render a molecule with deterministic, publication-style geometry."""
    mol = Chem.MolFromSmiles(smiles)
    if mol is None:
        return None
    try:
        AllChem.Compute2DCoords(mol)
        Chem.rdDepictor.StraightenDepiction(mol)
    except Exception:
        pass

    drawer = rdMolDraw2D.MolDraw2DCairo(size[0], size[1])
    _apply_common_draw_options(drawer)
    opts = drawer.drawOptions()
    try:
        opts.fixedBondLength = 28.0
        opts.fixedFontSize = 14
        opts.minFontSize = 14
        opts.maxFontSize = 14
        opts.fontFile = "BuiltinRobotoRegular"
        opts.padding = 0.05
        opts.centreMoleculesBeforeDrawing = True
        opts.prepareMolsBeforeDrawing = True
    except Exception:
        pass
    try:
        drawer.SetFontSize(14)
    except Exception:
        pass

    rdMolDraw2D.PrepareAndDrawMolecule(drawer, mol, legend=legend)
    drawer.FinishDrawing()
    return drawer.GetDrawingText()


# ---------------------------------------------------------------------------
# Small molecules are written, not drawn'''
          ns, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('renderer block not found; refusing unsafe edit')
          if ns != s:
              p.write_text(ns, encoding='utf-8')

      - name: Commit renderer fix
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chem_core.py
          if git diff --cached --quiet; then
            echo 'renderer already patched'
          else
            git commit -m 'fix: make molecule drawing scale deterministic'
            git push
          fi

      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Import production application
        env:
          SECRET_KEY: ci-test-secret-key
          PYTHONPATH: .
        run: python -c "import chem_core; import orca_orchestrator; import app; print('production imports OK')"
      - name: Run production and drawing tests
        env:
          SECRET_KEY: ci-test-secret-key
          PYTHONPATH: .
        run: pytest -q tests/test_production_wiring.py tests/test_drawing.py

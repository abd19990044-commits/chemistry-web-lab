name: CI

on:
  push:
    branches: [main, production-hardening-2026-08]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Import production application
        env:
          SECRET_KEY: ci-test-secret-key
        run: python -c "import chem_core; import orca_orchestrator; import app; print('production imports OK')"
      - name: Run ORCA policy regression tests
        env:
          SECRET_KEY: ci-test-secret-key
        run: python -m pytest -q tests/test_orca_policy.py
      - name: Run production and drawing tests
        env:
          SECRET_KEY: ci-test-secret-key
        run: python -m pytest -q tests/test_production_wiring.py tests/test_drawing.py
      - name: Run frontend load-time regression tests
        env:
          SECRET_KEY: ci-test-secret-key
        run: python tests/test_frontend.py

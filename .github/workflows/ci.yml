name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orca-production-hardening:
    name: ORCA Kaggle-native Production Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile hardened runtime
        run: |
          python -m py_compile \
            orca_orchestrator/callback_auth.py \
            orca_orchestrator/api.py \
            orca_orchestrator/service.py \
            orca_orchestrator/watchdog.py \
            orca_orchestrator/orca_artifacts.py \
            orca_orchestrator/runner/builder.py \
            orca_orchestrator/runner/kernel_runner.py
      - name: Test hardened runtime
        env:
          ORCA_CALLBACK_SECRET: test-only-callback-secret-0123456789abcdef
          ORCA_LOCAL_MODE: "1"
        run: |
          pytest -q \
            tests/test_kaggle_native_production.py \
            tests/test_kaggle_native_workflow.py \
            tests/test_continuation.py \
            tests/test_lifecycle_simulation.py \
            tests/test_end_to_end_chain.py \
            tests/test_orca_builder.py \
            tests/test_account_control.py \
            --junitxml=orca-production-report.xml
      - name: Upload ORCA production report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-production-report
          path: orca-production-report.xml
          if-no-files-found: ignore
      - name: Verify architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          svc = Path('orca_orchestrator/service.py').read_text()
          wd = Path('orca_orchestrator/watchdog.py').read_text()
          runner = Path('orca_orchestrator/runner/kernel_runner.py').read_text()
          builder = Path('orca_orchestrator/runner/builder.py').read_text()
          auth = Path('orca_orchestrator/callback_auth.py').read_text()
          assert 'CloudflareController' not in svc
          assert 'self.cf_controller' not in svc
          assert 'credential_vault' not in wd
          assert 'get_vault_manager' not in wd
          assert 'callback_token_sha256' in runner
          assert 'durable_epoch = EPOCH + 1' in runner
          assert '_FALLBACK_ENV = "SECRET_KEY"' in auth
          assert 'def advance_workflow_stage' in runner
          assert 'workflow_plan' in builder
          assert 'def _normalise_workflow_steps' in svc
          assert 'Cloudflare-backed multi-step workflows were removed' not in svc
          print('Kaggle-native ORCA runtime and workflow architecture verified')
          PY

  lint-and-static-check:
    name: Lint & Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff jsonschema

      - name: Run Ruff Baseline Audit
        continue-on-error: true
        run: |
          ruff check . --config pyproject.toml --output-format=github

      - name: Run Blocking Python Syntax Check
        run: |
          python -m compileall -q \
            app.py \
            chem_core.py \
            kaggle_runner.py \
            reaction_conditions.py \
            sitecustomize.py \
            usercustomize.py \
            chem_core \
            orca_orchestrator \
            orca_engine/src \
            tools

      - name: Validate Canonical Scientific Schemas
        run: |
          python -c "
          import json, jsonschema
          with open('schema/canonical_scientific.schema.json', 'r', encoding='utf-8') as f:
              schema = json.load(f)
          jsonschema.Draft202012Validator.check_schema(schema)
          print('Schema Draft 2020-12 check passed successfully')
          "

  test-matrix:
    name: Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [lint-and-static-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      ORCA_CALLBACK_SECRET: test-only-callback-secret-0123456789abcdef
      ORCA_LOCAL_MODE: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov jsonschema numpy
          python -m pip install -e ./orca_engine

      - name: Run Pytest Test Suite
        run: |
          pytest -v --ignore=tests/test_web_routes.py --junitxml=pytest-report.xml

      - name: Run legacy Kaggle CLI routes in isolated process
        env:
          ORCA_LOCAL_MODE: "0"
        run: |
          pytest -v tests/test_web_routes.py --junitxml=pytest-web-routes-report.xml

      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            pytest-report.xml
            pytest-web-routes-report.xml
          if-no-files-found: ignore

  security-and-secret-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Secret & Hardcoded Path Scanner
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          secret_patterns = [
              re.compile(r"KGAT_[A-Za-z0-9_-]{20,}"),
              re.compile(r'"kaggle_key"\s*:\s*"[a-f0-9]{32}"'),
              re.compile(r"CF_API_TOKEN\s*=\s*['\"][A-Za-z0-9_-]{20,}"),
          ]
          path_patterns = [
              re.compile(r"[gG]:[\\/]orca web lab", re.IGNORECASE),
              re.compile(r"C:[\\/]Users[\\/][a-zA-Z0-9_-]+", re.IGNORECASE),
          ]

          # Scan deployable/runtime surfaces. Historical forensic reports and test
          # fixtures intentionally contain example paths/token-shaped strings and
          # are not shipped as runtime credentials.
          roots = [
              '.env.example', '.github/workflows', 'app.py', 'chem_core.py',
              'kaggle_runner.py', 'reaction_conditions.py', 'sitecustomize.py',
              'usercustomize.py', 'chem_core', 'orca_orchestrator',
              'orca_engine/src', 'static/js', 'templates', 'tools',
          ]
          ignored = {'.git', '__pycache__', '.pytest_cache', 'node_modules', '.venv', 'venv'}
          violations = []

          def scan_file(path):
              if path.endswith(('.pyc', '.png', '.jpg', '.jpeg', '.tar', '.gz', '.zip', '.rar', '.out', '.db')):
                  return
              try:
                  with open(path, 'r', encoding='utf-8', errors='ignore') as handle:
                      for line_no, line in enumerate(handle, 1):
                          for pattern in secret_patterns + path_patterns:
                              if pattern.search(line):
                                  violations.append(f"{path}:{line_no} -> {line.strip()[:120]}")
              except (OSError, UnicodeError):
                  pass

          for root in roots:
              if os.path.isfile(root):
                  scan_file(root)
                  continue
              if not os.path.isdir(root):
                  continue
              for current, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in ignored]
                  for filename in files:
                      scan_file(os.path.join(current, filename))

          if violations:
              print(f"Found {len(violations)} runtime secret/path violations:")
              for violation in violations:
                  print(f"  {violation}")
              sys.exit(1)

          print("Runtime security and secret audit passed with 0 violations.")
          PY

  clean-install-verification:
    name: Clean Clone & Package Install
    needs: [lint-and-static-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Clean Package Build & Installation
        env:
          ORCA_CALLBACK_SECRET: test-only-callback-secret-0123456789abcdef
          ORCA_LOCAL_MODE: "1"
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -r requirements.txt
          python -m pip install pytest jsonschema numpy
          python -m pip install -e ./orca_engine
          pytest tests/test_canonical_scientific_schema.py tests/test_archive_security.py

  ci-gate:
    name: Release Gate
    needs:
      - orca-production-hardening
      - lint-and-static-check
      - test-matrix
      - security-and-secret-audit
      - clean-install-verification
    runs-on: ubuntu-latest
    steps:
      - name: Release Gate Check
        run: |
          echo "All CI jobs passed. Release gate is GREEN."

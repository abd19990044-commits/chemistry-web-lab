name: Apply SVG publication output and harden HF deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch publication renderer and deployment retry logic
        shell: python
        run: |
          from pathlib import Path

          # ---------------- chem_core.py: SVG alongside 600-DPI PNG ----------------
          p = Path('chem_core.py')
          s = p.read_text(encoding='utf-8')

          marker = '\ndef render_molecule_png(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE) -> bytes | None:\n'
          if 'def render_molecule_svg(' not in s:
              svg_func = '''\n\ndef render_molecule_svg(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE) -> bytes | None:\n    """Render the same molecular depiction as SVG for lossless publication."""\n    mol = Chem.MolFromSmiles(smiles)\n    if mol is None:\n        return None\n    try:\n        AllChem.Compute2DCoords(mol)\n        Chem.rdDepictor.StraightenDepiction(mol)\n    except Exception:\n        pass\n    drawer = rdMolDraw2D.MolDraw2DSVG(size[0], size[1])\n    _apply_common_draw_options(drawer)\n    opts = drawer.drawOptions()\n    try:\n        opts.fixedBondLength = 90.0\n        opts.fixedFontSize = 60.0\n        opts.minFontSize = 48.0\n        opts.maxFontSize = 66.0\n        opts.padding = 0.05\n    except Exception:\n        pass\n    try:\n        drawer.SetFontSize(60)\n    except Exception:\n        pass\n    rdMolDraw2D.PrepareAndDrawMolecule(drawer, mol, legend=legend)\n    drawer.FinishDrawing()\n    return drawer.GetDrawingText().encode("utf-8")\n\n'''
              if marker not in s:
                  raise SystemExit('chem_core.py: molecule marker not found')
              s = s.replace(marker, svg_func + marker, 1)

          marker2 = '\ndef generate_mol_file_bytes(smiles: str) -> bytes | None:\n'
          if 'def render_reaction_svg(' not in s:
              svg_reaction = '''\n\ndef render_reaction_svg(reactant_pairs, product_pairs) -> bytes | None:\n    """Render a reaction as true vector SVG using RDKit's reaction drawer.\n\n    Fractional coefficients are scaled to integers for the vector reaction\n    representation, matching the MDL/RXN convention used elsewhere in the app.\n    The 600-DPI PNG remains the exact preview renderer; this SVG is the\n    publication/export path and therefore has no raster DPI ceiling.\n    """\n    try:\n        factor = Fraction(1)\n        for coefficient, _ in list(reactant_pairs) + list(product_pairs):\n            factor = factor * Fraction(coefficient).limit_denominator()\n        # Use the existing exact scaler when available; otherwise preserve\n        # integer coefficients directly.\n        def expand(pairs):\n            out = []\n            for coefficient, smiles in pairs:\n                n = Fraction(coefficient).limit_denominator()\n                if n.denominator != 1 or n <= 0:\n                    return None\n                out.extend([smiles] * int(n))\n            return out\n        left = expand(reactant_pairs)\n        right = expand(product_pairs)\n        if not left or not right:\n            return None\n        rxn = rdChemReactions.ReactionFromSmarts(\n            "%s>>%s" % (".".join(left), ".".join(right)), useSmiles=True)\n        if rxn is None:\n            return None\n        rdChemReactions.Compute2DCoordsForReaction(rxn)\n        drawer = rdMolDraw2D.MolDraw2DSVG(3600, 1800)\n        _apply_common_draw_options(drawer)\n        opts = drawer.drawOptions()\n        try:\n            opts.fixedBondLength = 90.0\n            opts.fixedFontSize = 60.0\n            opts.minFontSize = 48.0\n            opts.maxFontSize = 66.0\n            opts.padding = 0.08\n        except Exception:\n            pass\n        drawer.drawReaction(rxn)\n        drawer.FinishDrawing()\n        return drawer.GetDrawingText().encode("utf-8")\n    except Exception as exc:\n        logger.info("RDKit SVG reaction rendering failed: %s", exc)\n        return None\n\n'''
              if marker2 not in s:
                  raise SystemExit('chem_core.py: mol file marker not found')
              s = s.replace(marker2, svg_reaction + marker2, 1)

          p.write_text(s, encoding='utf-8')

          # ---------------- app.py: return SVG data with existing JSON ----------------
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '        image_bytes = core.render_molecule_png(smiles)\n        if not image_bytes:\n            return error_response("Could not draw a structure for this input.", 422)\n        mol_bytes = core.generate_mol_file_bytes(smiles)\n'
          new = '        image_bytes = core.render_molecule_png(smiles)\n        svg_bytes = core.render_molecule_svg(smiles)\n        if not image_bytes or not svg_bytes:\n            return error_response("Could not draw a structure for this input.", 422)\n        mol_bytes = core.generate_mol_file_bytes(smiles)\n'
          if old not in s:
              raise SystemExit('app.py: molecule render block not found')
          s = s.replace(old, new, 1)
          old = '            "image_png_base64": b64(image_bytes),\n            "mol_file_base64": b64(mol_bytes),\n'
          new = '            "image_png_base64": b64(image_bytes),\n            "image_svg_base64": b64(svg_bytes),\n            "mol_file_base64": b64(mol_bytes),\n'
          if old not in s:
              raise SystemExit('app.py: molecule payload block not found')
          s = s.replace(old, new, 1)

          old = '        image_bytes = core.render_reaction_png(as_pairs(reactant_terms), as_pairs(product_terms),\n                                               small_as_formula=small_as_formula)\n        if not image_bytes:\n            return error_response("Could not draw the reaction scheme — check the formulas.", 422)\n'
          new = '        image_bytes = core.render_reaction_png(as_pairs(reactant_terms), as_pairs(product_terms),\n                                               small_as_formula=small_as_formula)\n        svg_bytes = core.render_reaction_svg(as_pairs(rxn_reactants), as_pairs(rxn_products))\n        if not image_bytes or not svg_bytes:\n            return error_response("Could not draw the reaction scheme — check the formulas.", 422)\n'
          if old not in s:
              raise SystemExit('app.py: reaction render block not found')
          s = s.replace(old, new, 1)
          old = '            "image_png_base64": b64(image_bytes),\n            "rxn_file_base64": b64(rxn_bytes),\n'
          new = '            "image_png_base64": b64(image_bytes),\n            "image_svg_base64": b64(svg_bytes),\n            "rxn_file_base64": b64(rxn_bytes),\n'
          if old not in s:
              raise SystemExit('app.py: reaction payload block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # ---------------- app.js: add SVG export buttons without changing layout ----------------
          p = Path('static/js/app.js')
          s = p.read_text(encoding='utf-8')
          old = '  function setDownload(anchorEl, b64, mime, filename) {\n    anchorEl.href = b64ToDataUrl(b64, mime);\n    anchorEl.download = filename;\n  }\n'
          new = old + '''  function setPublicationDownload(containerId, b64, filename, label) {\n    const container = document.getElementById(containerId);\n    if (!container || !b64) return;\n    const old = document.getElementById(`${containerId}-svg-download`);\n    if (old) old.remove();\n    const a = document.createElement("a");\n    a.id = `${containerId}-svg-download`;\n    a.className = "btn btn-ghost";\n    a.textContent = label || "Download SVG (vector)";\n    a.href = b64ToDataUrl(b64, "image/svg+xml;charset=utf-8");\n    a.download = filename;\n    a.setAttribute("title", "Lossless vector export for publication");\n    container.appendChild(a);\n  }\n'''
          if old not in s:
              raise SystemExit('app.js: setDownload helper not found')
          s = s.replace(old, new, 1)

          old = '      document.getElementById("explorer-image").src = b64ToDataUrl(data.image_png_base64, "image/png");\n'
          new = old + '      setPublicationDownload("explorer-result", data.image_svg_base64, `${data.filename}.svg`, "Download SVG — vector");\n'
          if old not in s:
              raise SystemExit('app.js: explorer image line not found')
          s = s.replace(old, new, 1)

          old = '      document.getElementById("reaction-image").src = b64ToDataUrl(data.image_png_base64, "image/png");\n'
          new = old + '      setPublicationDownload("reaction-result", data.image_svg_base64, "reaction.svg", "Download SVG — vector");\n'
          if old not in s:
              raise SystemExit('app.js: reaction image line not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # ---------------- HF deploy: retries for transient GitHub->HF connection failures ----------------
          p = Path('.github/workflows/hf-sync.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('uses: actions/checkout@v6', 'uses: actions/checkout@v4')
          s = s.replace('python -m pip install --disable-pip-version-check --no-cache-dir -U "huggingface_hub>=0.35.0"', 'python -m pip install --disable-pip-version-check --no-cache-dir --retries 6 --timeout 60 -U "huggingface_hub>=0.35.0"')
          s = s.replace('          api = HfApi(token=token)\n\n          who = api.whoami()', '          import time\n\n          api = HfApi(token=token)\n          for attempt in range(1, 6):\n              try:\n                  who = api.whoami()\n                  break\n              except Exception as exc:\n                  print(f"Hugging Face authentication attempt {attempt}/5 failed: {exc}")\n                  if attempt == 5: raise\n                  time.sleep(10 * attempt)')
          s = s.replace('          api = HfApi(token=token)\n          commit = api.upload_folder(', '          import time\n\n          api = HfApi(token=token)\n          commit = None\n          last_error = None\n          for attempt in range(1, 6):\n              try:\n                  commit = api.upload_folder(')
          s = s.replace('              delete_patterns="*",\n          )\n\n          print(f"Hugging Face commit created: {commit.oid}")', '              delete_patterns="*",\n                  )\n                  break\n              except Exception as exc:\n                  last_error = exc\n                  print(f"Hugging Face upload attempt {attempt}/5 failed: {exc}")\n                  if attempt < 5:\n                      time.sleep(15 * attempt)\n          if commit is None:\n              raise RuntimeError(f"Hugging Face upload failed after 5 attempts: {last_error}")\n\n          print(f"Hugging Face commit created: {commit.oid}")')
          s = s.replace('          api = HfApi(token=os.environ["HF_TOKEN"])\n          info = api.repo_info(repo_id=os.environ["HF_SPACE"], repo_type="space")', '          import time\n          api = HfApi(token=os.environ["HF_TOKEN"])\n          info = None\n          for attempt in range(1, 6):\n              try:\n                  info = api.repo_info(repo_id=os.environ["HF_SPACE"], repo_type="space")\n                  break\n              except Exception as exc:\n                  print(f"Hugging Face verification attempt {attempt}/5 failed: {exc}")\n                  if attempt == 5: raise\n                  time.sleep(10 * attempt)')
          p.write_text(s, encoding='utf-8')

      - name: Validate all patched Python and workflow files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile chem_core.py app.py
          python - <<'PY'
          import yaml
          for path in ('.github/workflows/hf-sync.yml',):
              with open(path, encoding='utf-8') as f:
                  yaml.safe_load(f)
          print('Python and HF workflow syntax checks passed.')
          PY
          grep -q 'render_molecule_svg' chem_core.py
          grep -q 'render_reaction_svg' chem_core.py
          grep -q 'image_svg_base64' app.py
          grep -q 'setPublicationDownload' static/js/app.js
          grep -q 'attempt.*5' .github/workflows/hf-sync.yml

      - name: Commit patched application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chem_core.py app.py static/js/app.js .github/workflows/hf-sync.yml
          git commit -m 'feat: add vector SVG exports and harden Hugging Face deployment'
          git push

      - name: Remove one-time patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-svg-and-hf-hardening.yml
          git commit -m 'chore: remove one-time SVG deployment patch workflow'
          git push

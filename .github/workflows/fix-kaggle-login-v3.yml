name: Fix Kaggle login flow v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-kaggle-login-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('kaggle_runner.py'); s=p.read_text()
          if 'def verify_kaggle_credentials(' not in s:
              marker='\ndef list_jobs(kaggle_username: str, kaggle_key: str) -> list[dict]:\n'
              if marker not in s: raise SystemExit('list_jobs marker not found')
              fn='''\n\ndef verify_kaggle_credentials(kaggle_username: str, kaggle_key: str) -> dict:\n    """Fast authentication check without enumerating account history."""\n    auth = resolve_kaggle_auth(kaggle_username, kaggle_key)\n    with _temp_kaggle_env(kaggle_username, kaggle_key) as env:\n        result = _run_kaggle_cli(["kaggle","kernels","list","--mine","--csv","--page-size","1","--page","1"], env=env, timeout=30, attempts=2, base_delay=1.0)\n        combined=(result.stdout or "")+"\\n"+(result.stderr or "")\n        if result.returncode != 0:\n            _raise_if_cli_broken(combined); _raise_if_unreachable(combined)\n            low=combined.lower()\n            if "401" in combined or "unauthorized" in low or "authentication required" in low or "forbidden" in low:\n                raise RuntimeError("Kaggle rejected these credentials. Check the username and API key/token.")\n            raise RuntimeError((result.stderr or result.stdout or "Kaggle credential verification failed.").strip())\n    return {"username": auth["username"]}\n'''
              p.write_text(s.replace(marker,fn+marker,1))
          PY
      - name: Patch Flask routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py'); s=p.read_text()
          start=s.find('@app.route("/api/kaggle/login", methods=["POST"])')
          end=s.find('@app.route("/api/kaggle/submit", methods=["POST"])',start)
          if start<0 or end<0: raise SystemExit('login route boundaries not found')
          route='''@app.route("/api/kaggle/login", methods=["POST"])\ndef api_kaggle_login():\n    """Fast credential verification; job recovery is separate."""\n    data=request.get_json(force=True,silent=True) or {}\n    kaggle_username=(data.get("kaggle_username") or "").strip()\n    kaggle_key=(data.get("kaggle_key") or "").strip()\n    kaggle_username,kaggle_key=kaggle_runner.clean_kaggle_credentials(kaggle_username,kaggle_key)\n    if not kaggle_username or not kaggle_key: return error_response("Please enter your Kaggle username and API key/token.")\n    try:\n        auth=kaggle_runner.verify_kaggle_credentials(kaggle_username,kaggle_key)\n        return jsonify({"ok":True,"username":auth["username"]})\n    except (kaggle_runner.KaggleCliUnavailable,kaggle_runner.KaggleUnreachable) as exc:\n        return error_response(str(exc),503)\n    except Exception as exc:\n        return error_response(f"Could not sign in to Kaggle: {str(exc).strip() or 'credential verification failed.'}",401)\n\n\n@app.route("/api/kaggle/sync", methods=["POST"])\ndef api_kaggle_sync():\n    """Synchronize jobs independently from authentication."""\n    data=request.get_json(force=True,silent=True) or {}\n    kaggle_username=(data.get("kaggle_username") or "").strip()\n    kaggle_key=(data.get("kaggle_key") or "").strip()\n    kaggle_username,kaggle_key=kaggle_runner.clean_kaggle_credentials(kaggle_username,kaggle_key)\n    if not kaggle_username or not kaggle_key: return error_response("Missing Kaggle username or API key/token.")\n    try:\n        return jsonify({"ok":True,"jobs":kaggle_runner.list_jobs(kaggle_username,kaggle_key)})\n    except (kaggle_runner.KaggleCliUnavailable,kaggle_runner.KaggleUnreachable) as exc:\n        return error_response(str(exc),503)\n    except Exception as exc:\n        return error_response(f"Could not synchronize Kaggle jobs: {exc}",502)\n\n\n'''
          p.write_text(s[:start]+route+s[end:])
          PY
      - name: Patch browser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('static/js/app.js'); s=p.read_text()
          old='''  async function postJSON(url, body) {\n    const resp = await fetch(url, {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify(body),\n    });\n    const data = await resp.json().catch(() => ({ ok: false, error: "Invalid response from server." }));\n    if (!resp.ok || !data.ok) throw new Error(data.error || "An unexpected error occurred.");\n    return data;\n  }'''
          new='''  async function postJSON(url, body) {\n    const resp = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });\n    const contentType = resp.headers.get("content-type") || "";\n    let data = null;\n    if (contentType.includes("application/json")) data = await resp.json().catch(() => null);\n    else { const text = await resp.text().catch(() => ""); const detail = text.replace(/<[^>]+>/g," ").replace(/\\s+/g," ").trim().slice(0,240); throw new Error(`Server returned HTTP ${resp.status}${detail ? `: ${detail}` : "."}`); }\n    if (!data) throw new Error(`Server returned HTTP ${resp.status} with an invalid JSON response.`);\n    if (!resp.ok || !data.ok) throw new Error(data.error || `Request failed (HTTP ${resp.status}).`);\n    return data;\n  }'''
          if old not in s: raise SystemExit('postJSON not found')
          s=s.replace(old,new,1)
          a=s.find('  async function attemptLogin(username, key, opts) {')
          b=s.find('  // If credentials were remembered from a previous visit',a)
          if a<0 or b<0: raise SystemExit(f'attemptLogin boundaries not found: {a}, {b}')
          repl='''  async function syncKaggleJobs(username, key, opts = {}) {\n    try { const data = await postJSON("/api/kaggle/sync", {kaggle_username: username, kaggle_key: key}); mergeRemoteJobs(username,key,data.jobs||[]); pollAllActiveJobs(); return true; }\n    catch (err) { if (!(opts && opts.silent)) showToast(`<strong>Kaggle job sync failed</strong><br>${err.message}`); else console.warn("Kaggle job sync failed:",err.message); return false; }\n  }\n\n  async function attemptLogin(username, key, opts) {\n    const silent=opts&&opts.silent; if(!silent){hide(kaggleLoginError);show(kaggleLoginLoading);}\n    try { const data=await postJSON("/api/kaggle/login",{kaggle_username:username,kaggle_key:key}); const u=data.username||username; setSignedIn(u,key); sessionKaggleKey=key; syncKaggleJobs(u,key,{silent:true}); return true; }\n    catch(err){ if(!silent) showError(kaggleLoginError,err.message); return false; }\n    finally{ if(!silent) hide(kaggleLoginLoading); }\n  }\n\n'''
          p.write_text(s[:a]+repl+s[b:])
          PY
      - name: Validate
        run: |
          python -m py_compile app.py kaggle_runner.py
          node --check static/js/app.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py kaggle_runner.py static/js/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair Kaggle login and background synchronization [skip ci]'
          git push

name: Kaggle-native workflow migration

on:
  push:
    paths:
      - '.github/workflows/kaggle-native-workflow-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply workflow migration
        run: python .github/scripts/kaggle_native_workflow_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile production workflow path
        run: |
          python -m py_compile \
            orca_orchestrator/api.py \
            orca_orchestrator/service.py \
            orca_orchestrator/runner/builder.py \
            orca_orchestrator/runner/kernel_runner.py \
            tests/test_kaggle_native_workflow.py
      - name: Run workflow and continuation regressions
        env:
          ORCA_CALLBACK_SECRET: workflow-test-secret-0123456789abcdef012345
          ORCA_LOCAL_MODE: '1'
        run: |
          pytest -q \
            tests/test_kaggle_native_workflow.py \
            tests/test_kaggle_native_production.py \
            tests/test_continuation.py \
            tests/test_lifecycle_simulation.py \
            tests/test_end_to_end_chain.py \
            tests/test_orca_builder.py \
            tests/test_account_control.py
      - name: Verify Cloudflare-free workflow architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          svc = Path('orca_orchestrator/service.py').read_text()
          run = Path('orca_orchestrator/runner/kernel_runner.py').read_text()
          builder = Path('orca_orchestrator/runner/builder.py').read_text()
          assert 'def advance_workflow_stage' in run
          assert 'workflow_plan' in builder
          assert 'CloudflareController' not in svc
          assert 'self.cf_controller' not in svc
          assert 'Cloudflare-backed multi-step workflows were removed' not in svc
          assert 'def _normalise_workflow_steps' in svc
          assert 'def list_workflows' in svc
          print('Kaggle-native multi-step workflow architecture verified')
          PY
      - name: Commit verified workflow implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            orca_orchestrator/api.py \
            orca_orchestrator/service.py \
            orca_orchestrator/runner/builder.py \
            orca_orchestrator/runner/kernel_runner.py \
            tests/test_kaggle_native_workflow.py
          git commit -m 'feat: restore multi-step ORCA workflows on Kaggle ledger'
          git push origin HEAD:main

name: Apply molecule drawing scale fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch molecule renderer
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("chem_core.py")
          s = p.read_text(encoding="utf-8")

          pattern = re.compile(
              r'def render_molecule_png\(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE\) -> bytes \| None:\n'
              r'.*?\n\n\n# ---------------------------------------------------------------------------\n# Small molecules are written, not drawn',
              re.S,
          )

          replacement = '''def render_molecule_png(smiles: str, legend: str = "", size=MOL_IMAGE_SIZE) -> bytes | None:
    """Render one molecule with a stable chemical drawing scale.

    The molecule renderer must not rescale the whole skeleton every time a
    substituent is added. A fixed bond length is therefore used as the primary
    scale, while the canvas is allowed to contain more whitespace. This keeps
    ring systems and side-chain labels visually consistent across compounds.
    """
    mol = Chem.MolFromSmiles(smiles)
    if mol is None:
        return None
    try:
        AllChem.Compute2DCoords(mol)
        Chem.rdDepictor.StraightenDepiction(mol)
    except Exception:  # noqa: BLE001
        pass

    drawer = rdMolDraw2D.MolDraw2DCairo(size[0], size[1])
    _apply_common_draw_options(drawer)
    opts = drawer.drawOptions()
    # Chemical scale is defined by the bond length, not by how much of the
    # 560x420 canvas the current molecule happens to occupy.
    try:
        opts.fixedBondLength = 30.0
        opts.fixedFontSize = 16.0
        opts.minFontSize = 12.0
        opts.maxFontSize = 18.0
    except Exception:  # noqa: BLE001
        pass
    rdMolDraw2D.PrepareAndDrawMolecule(drawer, mol, legend=legend)
    drawer.FinishDrawing()
    return drawer.GetDrawingText()


# ---------------------------------------------------------------------------
# Small molecules are written, not drawn'''

          ns, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit("render_molecule_png block not found; refusing to modify the file")
          p.write_text(ns, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chem_core.py
          if git diff --cached --quiet; then
            echo "No change required"
            exit 0
          fi
          git commit -m "fix: stabilize molecule drawing scale"
          git push

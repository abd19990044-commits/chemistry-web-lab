name: Remove Cloudflare runtime dependency

on:
  push:
    paths:
      - '.github/workflows/remove-cloudflare-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/remove_cloudflare_runtime.py
      - name: Verify
        run: |
          python -m py_compile orca_orchestrator/api.py orca_orchestrator/service.py orca_orchestrator/runner/builder.py orca_orchestrator/runner/kernel_runner.py
          python - <<'PY'
          from pathlib import Path
          svc=Path('orca_orchestrator/service.py').read_text()
          api=Path('orca_orchestrator/api.py').read_text()
          run=Path('orca_orchestrator/runner/kernel_runner.py').read_text()
          assert 'CloudflareController' not in svc
          assert 'self.cf_controller' not in svc
          assert 'def ingest_kernel_update' in svc
          assert 'IntegrityError' in svc
          assert 'KAGGLE_LEDGER' in svc
          assert '/api/orca/wake' in run
          assert '/api/orca/kernel-update' in run
          assert 'wake_site()' in run
          assert '/wake' in api and '/kernel-update' in api
          print('Cloudflare-free ORCA runtime checks passed')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orca_orchestrator/service.py orca_orchestrator/api.py
          git commit -m 'fix: remove Cloudflare from ORCA runtime and resume path'
          git push origin HEAD:main
